plugins {
    id 'java'
}

group = 'org.capybit'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
        maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    if (path.startsWith(':plugins:')) {
        apply from: rootProject.file('gradle/plugin-generated-jars.gradle')
    }
}

tasks.register('copyPluginJarsToGenerated') {
    group = 'build'
    description = 'Builds plugin JARs and copies them to the root Generated directory.'
    dependsOn(subprojects.findAll { it.path.startsWith(':plugins:') }.collect { it.tasks.named('copyPluginArtifactToGenerated') })
}

test {
    useJUnitPlatform()
}