rootProject.name = settingsDir.name

def pluginSourceExcludesScript = new File(settingsDir.parentFile, 'gradle/plugin-source-excludes.gradle')
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('java') {
        project.apply from: pluginSourceExcludesScript
    }
}

def pluginDependencies = [
    AreaEffects          : [],
    DbExample           : ['HexCore'],
    HexCasino           : [],
    HexCollections      : ['HexCore', 'HexTowns'],
    HexCore             : [],
    HexEconomy          : ['HexCore'],
    HexElimination      : ['HexCore'],
    HexEndEvent         : ['HexCore'],
    HexMinions          : ['HexCore', 'HexTowns', 'HexCollections'],
    HexNameTags         : ['HexCore'],
    HexNPC              : [],
    HexPortals          : [],
    HexQuests           : ['HexCore', 'HexEconomy', 'HexTowns'],
    HexRankExpiry       : ['HexCore'],
    HexRestrictions     : [],
    HexSequence         : ['HexCore'],
    HexSkills           : ['HexCore', 'HexTowns'],
    HexTowns            : ['HexCore', 'HexEconomy'],
    HexVelocityFallback : [],
    IcebergEvent        : ['HexCore'],
    Minigames           : ['HexCore'],
    StatsApi            : [],
    UiExample           : ['HexCore'],
    VishopBroadcast     : ['HexCore'],
    VishopBroadcastProxy: [],
    WaterDrawn          : ['HexCore'],
    WaterLevelFlood     : ['HexCore'],
    hexdisplayabovename : []
]

def collectDependencies
collectDependencies = { String pluginName, Set<String> collected ->
    pluginDependencies.get(pluginName, []).each { dependencyName ->
        if (dependencyName != settingsDir.name && collected.add(dependencyName)) {
            collectDependencies(dependencyName, collected)
        }
    }
}

def requiredPlugins = new LinkedHashSet<String>()
collectDependencies(settingsDir.name, requiredPlugins)

requiredPlugins.each { pluginName ->
    include ":plugins:${pluginName}"
    project(":plugins:${pluginName}").projectDir = new File(settingsDir.parentFile, pluginName)
}
