# ==========================================================
# HexNPC - persisted NPC definitions
# ==========================================================
# This file is managed by /hexnpc commands. Manual edits require /hexnpc reload.
#
# Format reference (filled in once you create your first NPC via /hexnpc create <id>):
#
# npcs:
#   example:
#     skin:
#       name: "Notch"               # skin source only (Mojang username); no longer the visible name
#       # value: "ewogIC..."
#       # signature: "abcd..."
#     appearance:
#       display-name: "&6&lKról"    # visible nickname; supports legacy colors (&6) and formats (&l).
#                                   # omit -> falls back to the NPC id. Independent from skin.
#       glow: false                 # true -> glowing outline
#       pose: standing              # standing | sitting | sleeping | crawling | sneaking
#     location:
#       world: world
#       x: 0.5
#       y: 65.0
#       z: 0.5
#       yaw: 0.0
#       pitch: 0.0
#     interaction:
#       click: true
#       proximity:
#         enabled: false
#         radius: 3.0
#         cooldown-ticks: 600
#     dialogue:
#       cooldown-ticks: 200
#       lines:
#         - { text: "&aHello, <player>!", delay-ticks: 0 }
#         - { text: "&7Welcome.", delay-ticks: 30 }
#     actions:
#       on-click:
#         - { type: message,         text: "&eYou clicked me." }
#         - { type: console-command, command: "say <player> spoke to example" }
#         - { type: player-command,  command: "spawn" }
#       on-proximity:
#         - { type: message,         text: "&7You feel watched..." }
#
# Backwards-compat: a flat list under "actions:" is treated as on-click only.
# New NPCs are written in the map form above.

npcs: {}
