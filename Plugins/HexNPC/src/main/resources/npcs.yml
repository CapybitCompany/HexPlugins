# ==========================================================
# HexNPC - persisted NPC definitions
# ==========================================================
# This file is managed by /hexnpc commands. Manual edits require /hexnpc reload.
#
# Format reference (filled in once you create your first NPC via /hexnpc create <id>):
#
# npcs:
#   example:
#     skin:                         # pick ONE source; all resolve to signed textures.
#       name: "Notch"               # (a) Mojang username. Skin source only; not the visible name.
#       # value: "ewogIC..."        # (b) direct signed textures value + ...
#       # signature: "abcd..."      #     ...signature (used as-is, no API call).
#       # url: "https://.../skin.png"  # (c) skin PNG URL, resolved via MineSkin v2 (needs skins.mineskin.enabled).
#       # mineskin-uuid: "..."      # (d) existing MineSkin skin UUID, fetched via /v2/skins/:uuid.
#                                   # Resolved value/signature are written back here so the API is
#                                   # not hit again on the next spawn/restart. On failure the
#                                   # default skin is kept.
#     appearance:
#       display-name: "&6&lKról"    # visible nickname; supports legacy colors (&6) and formats (&l).
#                                   # omit -> falls back to the NPC id. Independent from skin.
#       glow: false                 # true -> glowing outline
#       glow-color: gold            # optional glow color: one of the 16 team colors
#                                   # (black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple,
#                                   #  gold, gray, dark_gray, blue, green, aqua, red, light_purple,
#                                   #  yellow, white). Only applies while glow is true. Does NOT
#                                   #  affect the &-code nameplate color. Omit -> white glow.
#       pose: standing              # standing | sitting | sleeping | crawling | sneaking
#     look-at:                      # optional head/eye tracking; independent from dialogue/proximity.
#       enabled: true               # NPC turns head/body toward the nearest player in range.
#       range: 6.0                  # optional; omit or <=0 -> falls back to proximity.default-radius.
#       interval-ticks: 5           # update cadence; clamped to >= 1.
#       reset-when-empty: true      # default true; turn back to the stored yaw/pitch when no one is near.
#                                   # Purely packet-side; the stored NPC yaw/pitch is never changed.
#     location:
#       world: world
#       x: 0.5
#       y: 65.0
#       z: 0.5
#       yaw: 0.0
#       pitch: 0.0
#     interaction:
#       click: true
#       proximity:
#         enabled: false
#         radius: 3.0
#         cooldown-ticks: 600
#     dialogue:
#       cooldown-ticks: 200
#       lines:
#         - { text: "&aHello, <player>!", delay-ticks: 0 }
#         - { text: "&7Welcome.", delay-ticks: 30 }
#     actions:
#       on-click:
#         - { type: message,         text: "&eYou clicked me." }
#         - { type: console-command, command: "say <player> spoke to example" }
#         - { type: player-command,  command: "spawn" }
#       on-proximity:
#         - { type: message,         text: "&7You feel watched..." }
#
# Backwards-compat: a flat list under "actions:" is treated as on-click only.
# New NPCs are written in the map form above.

npcs:
  event_guy:
    skin:
      name: event_guy
      value: 
      signature: 
      mineskin-uuid: a67bbbec436d4d2e97e109bdb6a0ccc7
    location:
      world: world
      x: 2780.4229533632897
      y: 74.0
      z: 917.4829381566071
      yaw: 83.226776
      pitch: 0.15010768
    interaction:
      click: true
      proximity:
        enabled: false
        radius: 0.0
        cooldown-ticks: 0
    dialogue:
      cooldown-ticks: 0
      lines: []
    actions:
      on-click:
        - type: event-guy-menu
          shop: event_tickets
          event-command: event
          title: "&5Eventy"
      on-proximity: []
    appearance:
      display-name: "&5-> &fBilety &5| &fInformacja &5<-"
      glow: false
      pose: standing
    look-at:
      enabled: true
      interval-ticks: 5
      reset-when-empty: true
