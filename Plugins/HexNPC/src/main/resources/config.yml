# ==========================================================
# HexNPC - global defaults
# ==========================================================

# Master switch. false = plugin stays loaded but does not render or react to NPCs.
enabled: true

# Logs decisions about proximity scans, dialogue triggers, render show/hide.
debug: false

dialogue:
  # Delay between dialogue lines when an NPC dialogue does not override it.
  default-line-delay-ticks: 20      # 20 ticks = 1s
  # Per-player cooldown before the same NPC will fire dialogue again.
  default-cooldown-ticks: 200       # 10s
  # Optional prefix prepended to every dialogue line. Empty = no prefix.
  prefix: "&7[NPC] "

proximity:
  # How often the proximity scanner ticks.
  scan-interval-ticks: 10
  # Default radius (blocks) when an NPC enables proximity without overriding.
  default-radius: 3.0
  # Default proximity cooldown per player.
  default-cooldown-ticks: 600       # 30s

render:
  # NPCs are hidden for a player past this distance to keep packet traffic low.
  view-distance-blocks: 48
  # Delay (ticks) after spawn before the fake player is removed from tablist.
  tablist-remove-delay-ticks: 40
  # Vertical render offset (blocks) applied ONLY to the invisible seat mount of a
  # SITTING NPC, so it sits on the ground/block instead of floating in the air.
  # Purely visual/packet-side; the stored NPC location is never changed.
  # Negative = lower. Default -1.0.
  sitting-y-offset: -1.0

# Skin resolution. NPC skins can be configured per-NPC in npcs.yml by player name,
# by direct signed textures (value/signature), by skin URL, or by MineSkin skin UUID.
# URL / MineSkin-UUID sources are resolved to signed textures via the MineSkin v2 API
# and the result (value/signature) is persisted back into npcs.yml, so the API is not
# hit on every spawn/restart. On any failure the old/default skin is kept.
skins:
  mineskin:
    # Must be true to resolve "url:" and "mineskin-uuid:" skin sources.
    enabled: true
    # Optional MineSkin API key (https://account.mineskin.org). Leave empty for
    # anonymous access (stricter rate limits). No secrets are hardcoded.
    api-key: ""
    # Sent as User-Agent header; identify your server per MineSkin guidelines.
    user-agent: "HexNPC/1.0"
    base-url: "https://api.mineskin.org"
    request-timeout-seconds: 20
    # Job status polling for URL generation (POST /v2/queue + GET /v2/queue/:id).
    max-poll-attempts: 10
    poll-interval-millis: 2000

# ==========================================================
# Podsystem sklepów NPC
# ==========================================================
# Sklepy definiuje się w shops.yml i otwiera akcją NPC typu "npc-shop".
# Wszystkie teksty widoczne dla graczy są po polsku.
shops:
  enabled: true
  # Gdy true, transakcje wymagają HexEconomy. Gdy false i ekonomia jest
  # niedostępna, kup/sprzedaj i tak odmawiają, pokazując tylko komunikat
  # "economy-missing".
  require-economy: true
  # Format tytułu GUI. <shop> jest zastępowane tytułem sklepu z shops.yml.
  title-format: "<shop>"
  # Domyślny rozmiar GUI, gdy sklep pomija "size:" (9, 18, 27, 36, 45 lub 54).
  default-size: 54
  # Gdy true, przedmioty z customową nazwą/lore/enchantem/PDC/CustomModelData/
  # uszkodzeniem są odrzucane przez sklepy w trybie PLAIN_MATERIAL.
  prevent-selling-custom-items: true

  # --- Ceny ---
  # Liczba miejsc po przecinku ceny końcowej (0..8). Zaokrąglenie HALF_UP,
  # spójne z normalizacją sald HexEconomy (domyślnie 2 miejsca).
  # Semantyka cen: buy-price/sell-price to cena za skonfigurowaną ilość
  # "amount". Cena jednostkowa = cena / amount, a cena łączna = jednostkowa
  # * wybrana ilość. Dzięki temu przy ilości równej "amount" cena się nie
  # zmienia względem starszych konfiguracji.
  price-scale: 2

  # --- Wybór ilości ---
  # Przyciski szybkiego wyboru ilości w widoku szczegółów.
  quantity-presets:
    - 1
    - 64
  # Czy pokazywać przycisk „Własna ilość" (wprowadzanie przez tabliczkę/czat).
  enable-custom-quantity: true
  # Czy pokazywać przycisk „Sprzedaj wszystko".
  enable-sell-all: true

  # --- Edytor własnej ilości ---
  sign-editor:
    # true = preferuj wirtualny edytor tabliczki (PacketEvents). Gdy
    # PacketEvents jest niedostępny, plugin automatycznie użyje czatu.
    # Uwaga: czat jest ZAWSZE akceptowany równolegle — jeśli tabliczka po
    # cichu się nie otworzy, gracz może po prostu wpisać ilość na czacie.
    enabled: true
    # Po ilu sekundach oczekiwanie na wpisanie ilości wygasa (twardy timeout).
    timeout-seconds: 30
    # Po ilu sekundach wysłać podpowiedź o czacie, gdy edytor mógł się nie
    # otworzyć (krótki failover; musi być <= timeout-seconds).
    chat-fallback-seconds: 4

  # --- Potwierdzenie dużych transakcji ---
  # Gdy faktyczna ilość transakcji jest ŚCIŚLE większa niż "threshold",
  # przed wykonaniem pojawia się osobne GUI potwierdzenia. threshold: 64
  # oznacza potwierdzenie dopiero od 65 sztuk. Ujemna wartość wraca na 64.
  # Dotyczy kupna, sprzedaży wybranej ilości i „Sprzedaj wszystko".
  confirmation:
    enabled: true
    threshold: 64
    # Rozmiar i sloty GUI potwierdzenia (walidowane; bezpieczne domyślne).
    size: 27
    preview-slot: 13
    confirm-slot: 11
    cancel-slot: 15

  # --- Audyt transakcji (MySQL przez HexCore) ---
  # Zapisy append-only przez współdzieloną bazę HexCore. HexNPC NIE otwiera
  # własnego połączenia ani puli i nigdy nie zamyka puli HexCore. Brak
  # HexCore/bazy lub błąd audytu NIGDY nie blokuje ani nie cofa transakcji.
  audit-log:
    enabled: true
    # Nazwa tabeli (tylko [A-Za-z0-9_]+); pełna nazwa dostaje prefiks HexCore.
    table: "npc_shop_audit"
    # Czy logować także odrzucone próby jako status DENIED: dzienny limit kupna,
    # brak miejsca w ekwipunku, brak/za mało przedmiotów ORAZ odrzucone operacje
    # ekonomii (np. NOT_ENOUGH_FUNDS). Udane/nieudane transakcje są logowane
    # zawsze, niezależnie od tej opcji.
    log-denied-transactions: true

  # --- Domyślny układ GUI (globalny) ---
  # Pojedynczy sklep może nadpisać dowolne z tych pól w shops.yml
  # (sekcja <sklep>.layout). Wszystkie sloty są 0-based i muszą mieścić się
  # w rozmiarze GUI. Kolizje i wartości spoza zakresu są wykrywane, logowane
  # i zastępowane bezpiecznymi wartościami domyślnymi (bez awarii).
  default-layout:
    # AUTO  = itemy z shops.yml wypełniają item-slots i są dzielone na strony
    #         (kolejność z pliku; item.slot oraz item.page są ignorowane).
    # MANUAL = itemy trafiają na swoje slot/page z shops.yml.
    placement: AUTO
    # Sloty na przedmioty w widoku głównym — symetryczna siatka z widocznymi
    # odstępami (co druga kolumna). 12 pozycji na stronę => automatyczna
    # paginacja co 12 itemów.
    item-slots: [10, 12, 14, 16, 19, 21, 23, 25, 28, 30, 32, 34]
    # Nawigacja stron w dolnym rzędzie.
    navigation:
      previous-slot: 45
      page-slot: 49
      next-slot: 53
    # Wypełniacz tła (zwykle niewidoczny — nazwa to spacja).
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    # Widok szczegółów przedmiotu.
    detail:
      preview-slot: 4
      selected-info-slot: 13
      quantity-slots: [19, 21, 23]
      custom-quantity-slot: 25
      buy-slot: 38
      sell-all-slot: 40
      sell-slot: 42
      back-slot: 49

