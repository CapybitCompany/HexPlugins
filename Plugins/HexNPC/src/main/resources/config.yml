    invalid-quantity: "&cNieprawidłowa ilość. Podaj dodatnią liczbę całkowitą."
    quantity-too-small: "&cIlość jest za mała. Minimum to &f<min>x&c."
    quantity-too-large: "&cIlość jest za duża. Maksimum to &f<max>x&c."
    buy-limit-reached: "&cMożesz kupić maksymalnie &f<limit>x &ctego przedmiotu dziennie. Pozostało dziś: &f<remaining>x&c."
    sign-expired: "&cCzas na wpisanie ilości minął. Spróbuj ponownie."
    sign-prompt: "&eWpisz ilość (od &f<min> &edo &f<max>&e)."
    sign-chat-fallback: "&eJeśli tabliczka się nie otworzyła, wpisz ilość na czacie."
    nothing-to-sell: "&cNie masz nic do sprzedania."
    buy-disabled: "&cTego przedmiotu nie można kupić."
    sell-disabled: "&cTego przedmiotu nie można sprzedać."
    already-purchased: "&cTen przedmiot już został zakupiony."
    reward-failed: "&cNie udało się przyznać nagrody. Płatność została cofnięta."
