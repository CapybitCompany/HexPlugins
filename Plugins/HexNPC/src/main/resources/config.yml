# ==========================================================
# HexNPC - global defaults
# ==========================================================

# Master switch. false = plugin stays loaded but does not render or react to NPCs.
enabled: true

# Logs decisions about proximity scans, dialogue triggers, render show/hide.
debug: false

dialogue:
  # Delay between dialogue lines when an NPC dialogue does not override it.
  default-line-delay-ticks: 20      # 20 ticks = 1s
  # Per-player cooldown before the same NPC will fire dialogue again.
  default-cooldown-ticks: 200       # 10s
  # Optional prefix prepended to every dialogue line. Empty = no prefix.
  prefix: "&7[NPC] "

proximity:
  # How often the proximity scanner ticks.
  scan-interval-ticks: 10
  # Default radius (blocks) when an NPC enables proximity without overriding.
  default-radius: 3.0
  # Default proximity cooldown per player.
  default-cooldown-ticks: 600       # 30s

render:
  # NPCs are hidden for a player past this distance to keep packet traffic low.
  view-distance-blocks: 48
  # Delay (ticks) after spawn before the fake player is removed from tablist.
  tablist-remove-delay-ticks: 40
  # Vertical render offset (blocks) applied ONLY to the invisible seat mount of a
  # SITTING NPC, so it sits on the ground/block instead of floating in the air.
  # Purely visual/packet-side; the stored NPC location is never changed.
  # Negative = lower. Default -1.0.
  sitting-y-offset: -1.0

# Skin resolution. NPC skins can be configured per-NPC in npcs.yml by player name,
# by direct signed textures (value/signature), by skin URL, or by MineSkin skin UUID.
# URL / MineSkin-UUID sources are resolved to signed textures via the MineSkin v2 API
# and the result (value/signature) is persisted back into npcs.yml, so the API is not
# hit on every spawn/restart. On any failure the old/default skin is kept.
skins:
  mineskin:
    # Must be true to resolve "url:" and "mineskin-uuid:" skin sources.
    enabled: false
    # Optional MineSkin API key (https://account.mineskin.org). Leave empty for
    # anonymous access (stricter rate limits). No secrets are hardcoded.
    api-key: ""
    # Sent as User-Agent header; identify your server per MineSkin guidelines.
    user-agent: "HexNPC/1.0"
    base-url: "https://api.mineskin.org"
    request-timeout-seconds: 20
    # Job status polling for URL generation (POST /v2/queue + GET /v2/queue/:id).
    max-poll-attempts: 10
    poll-interval-millis: 2000

# NPC shop subsystem. Shops are defined in shops.yml and opened from NPC
# actions with type "npc-shop". User-facing texts in Polish.
shops:
  enabled: true
  # When true, all transactions require HexEconomy. When false and economy is
  # missing, buy/sell flows still refuse but no error is shown beyond the
  # "economy-missing" message.
  require-economy: true
  # GUI title format. <shop> is replaced by the shop's configured title.
  title-format: "&8Sklep: &6<shop>"
  # Fallback size when a shop omits "size:".
  default-size: 54
  # Fallback central sell-slot when a shop omits "sell-slot:".
  default-sell-slot: 49
  # When true, items with custom name/lore/enchant/PDC/CustomModelData/damage
  # are refused by PLAIN_MATERIAL shops.
  prevent-selling-custom-items: true
  messages:
    economy-missing: "&cEkonomia jest niedostępna."
    shop-not-found: "&cNie znaleziono sklepu: &f<shop>"
    inventory-full: "&cNie masz miejsca w ekwipunku."
    not-enough-money: "&cNie masz wystarczająco pieniędzy."
    not-enough-items: "&cNie masz wystarczająco przedmiotów."
    bought: "&aKupiono &f<amount>x <item> &aza &f<price>&a."
    sold: "&aSprzedano &f<amount>x <item> &aza &f<price>&a."
    transaction-failed: "&cTransakcja nie powiodła się. &7<reason>"
    trade-busy: "&ePoczekaj, poprzednia transakcja nadal trwa."
