# Gotowe menu dla DeluxeMenus.
# Po zbudowaniu/skopiowaniu pluginu plik pojawi się w: plugins/HexSkills/deluxemenus/hexskills.yml
# Skopiuj ten plik do folderu gui_menus DeluxeMenus i dodaj go w configu DeluxeMenus,
# albo przenieś zawartość do istniejącej konfiguracji menu.
menu_title: '&8Twoje skille'
open_command:
  - skills
  - skille
size: 45
update_interval: 20
items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '
    slots:
      - 0-44

  mining:
    material: IRON_PICKAXE
    slot: 10
    display_name: '&e%hexskills_mining_display_name%'
    item_flags:
      - HIDE_ATTRIBUTES
    lore:
      - '&7Poziom: &f%hexskills_mining_level%&7/&f%hexskills_mining_max_level%'
      - '&7XP: &f%hexskills_mining_xp%'
      - '&7Do następnego: &f%hexskills_mining_xp_to_next% XP'
      - '&7Postęp: &a%hexskills_mining_progress_percent%%'
      - '&8[%hexskills_mining_progress_bar%&8]'
      - '&7Źródła XP są zdefiniowane w &fskills.yml&7.'

  combat:
    material: IRON_SWORD
    slot: 12
    display_name: '&e%hexskills_combat_display_name%'
    item_flags:
      - HIDE_ATTRIBUTES
    lore:
      - '&7Poziom: &f%hexskills_combat_level%&7/&f%hexskills_combat_max_level%'
      - '&7XP: &f%hexskills_combat_xp%'
      - '&7Do następnego: &f%hexskills_combat_xp_to_next% XP'
      - '&7Postęp: &a%hexskills_combat_progress_percent%%'
      - '&8[%hexskills_combat_progress_bar%&8]'
      - '&7Źródła XP są zdefiniowane w &fskills.yml&7.'

  farming:
    material: WHEAT
    slot: 14
    display_name: '&e%hexskills_farming_display_name%'
    lore:
      - '&7Poziom: &f%hexskills_farming_level%&7/&f%hexskills_farming_max_level%'
      - '&7XP: &f%hexskills_farming_xp%'
      - '&7Do następnego: &f%hexskills_farming_xp_to_next% XP'
      - '&7Postęp: &a%hexskills_farming_progress_percent%%'
      - '&8[%hexskills_farming_progress_bar%&8]'
      - '&7Bonus: szansa na drop &fx2 &7i &fx3&7.'
      - '&8Konfiguracja: effects.farming w skills.yml'

  fishing:
    material: FISHING_ROD
    slot: 16
    display_name: '&e%hexskills_fishing_display_name%'
    item_flags:
      - HIDE_ATTRIBUTES
    lore:
      - '&7Poziom: &f%hexskills_fishing_level%&7/&f%hexskills_fishing_max_level%'
      - '&7XP: &f%hexskills_fishing_xp%'
      - '&7Do następnego: &f%hexskills_fishing_xp_to_next% XP'
      - '&7Postęp: &a%hexskills_fishing_progress_percent%%'
      - '&8[%hexskills_fishing_progress_bar%&8]'
      - '&7Bonus: lepszy łup i dodatkowe itemy.'
      - '&8Konfiguracja: effects.fishing w skills.yml'

  summary:
    material: BOOK
    slot: 31
    display_name: '&6Podsumowanie'
    lore:
      - '&7Liczba skillów: &f%hexskills_count%'
      - '&7Dostępne: &f%hexskills_list%'
      - '&8Placeholdery: %hexskills_<skill>_level%,'
      - '&8%hexskills_<skill>_xp_to_next%, %hexskills_<skill>_progress_bar%'
