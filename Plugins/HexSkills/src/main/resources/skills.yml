schema-version: 1

skills:
  mining:
    enabled: true
    display-name: "Kopanie"
    scope: TOWN_PLAYER
    max-level: 100
    xp-per-level: 100
    xp-sources:
      - trigger: minecraft.block.break
        xp: 1
        filters:
          material: STONE
      - trigger: minions.resource.claimed
        xp: 1
        amount-multiplier: 0.05
        filters:
          resource-id: minecraft:cobblestone

  combat:
    enabled: true
    display-name: "Walka"
    scope: TOWN_PLAYER
    max-level: 100
    xp-per-level: 100
    xp-sources:
      - trigger: minecraft.entity.kill
        xp: 5
      - trigger: custom.mob.kill
        xp: 15
        filters:
          mob-id: hex:ice_beast

