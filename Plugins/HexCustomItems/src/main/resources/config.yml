      coins: 2
      command-template: "eco give %player% %coins%"

  hex_coin_3:
    material: "PAPER"
    name: "&6Hex-Coinsy&f(3)"
    lore:
      - "&f3 Hex-Coinsy (Kliknij PPM)"
    drop-protection: true
    effect:
      type: "HEX_COINS"
      coins: 3
      command-template: "eco give %player% %coins%"

  hex_coin_5:
