    lore:
      - "&fPodpal wroga! (Kliknij PPM)"
    drop-protection: false
    effect:
      type: "TARGET_FIRE"
      max-distance: 5.0
      fire-seconds: 5

  iceball_item:
    material: "PRISMARINE_CRYSTALS"
    name: "&6Iceball"
    lore:
      - "&fZamróź wroga! (Kliknij PPM)"
    drop-protection: false
