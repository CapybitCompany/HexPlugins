prefix: "&8[&6HexItems&8]&f "

permissions:
  give: "hex.items.give"
  reload: "hex.items.reload"

settings:
  max-give-amount: 64
  protect-ops-from-negative-effects: true

messages:
  no-permission: "&cBrak uprawnień."
  player-not-found: "&cTen gracz nie jest online."
  invalid-number: "&cNiepoprawna liczba."
  item-not-found: "&cNie znaleziono itemu: &e%item_id%&c."
  usage-main: "&7Użycie: &e/hexcustomitems <give|reload|list>"
  usage-give: "&7Użycie: &e/hexcustomitems give <item_id> <player> [amount]"
  reloaded: "&aKonfiguracja HexCustomItems została przeładowana."
  given-sender: "&aDano &e%amount%x %item_name% &agraczowi &e%target%&a."
  given-target: "&7Otrzymałeś &e%amount%x %item_name%&7."
  list-header: "&7Dostępne itemy: &e%items%"
  target-player-required: "&cMusisz celować w gracza."
  target-too-far: "&cGracz jest za daleko."
  target-op-protected: "&cNie możesz użyć tego itemu na operatorze."
  drop-blocked: "&cNie możesz wyrzucić tego itemu."

sounds:
  consume: "item.book.page_turn"
  drink: "entity.generic.drink"
  dark: "entity.vex.charge"
  fire: "item.flintandsteel.use"
  ice: "block.glass.break"
  throw: "entity.witch.throw"
  wind-launch: "entity.wither.shoot"
  wind-hit: "entity.generic.explode"

wind-charge:
  radius: 2.8
  power: 1.55
  power-owner: 0.65
  up: 0.36
  up-owner: 0.14
  recoil: 0.28
  recoil-up: 0.08
  projectile-speed: 1.7
  particle-explosion-count: 3
  particle-range: 32

items:
  jump_potion:
    material: "POTION"
    name: "&6Mikstura Skoku"
    lore:
      - "&fSkok II - 7 sekund"
    drop-protection: false
    effect:
      type: "SELF_POTION"
      potion: "JUMP_BOOST"
      duration-seconds: 7
      amplifier: 1

  slowness_splash:
    material: "SPLASH_POTION"
    name: "&6Miotana Mikstura Spowolnienia"
    lore:
      - "&fRzuć w graczy, aby spowolnić ich na 5 sekund."
    drop-protection: false
    effect:
      type: "AREA_PROJECTILE_POTION"
      potion: "SLOWNESS"
      duration-seconds: 5
      amplifier: 3
      radius: 4.0
      affect-self: false

  invisibility_cookie:
    material: "COOKIE"
    name: "&6Ciastko Niewidka"
    lore:
      - "&fNiewidzialność - 20 sekund"
    drop-protection: false
    effect:
      type: "SELF_POTION"
      potion: "INVISIBILITY"
      duration-seconds: 20
      amplifier: 0

  dark_powder:
    material: "GUNPOWDER"
    name: "&6Proszek Natychmiastowej Ciemności"
    lore:
      - "&fRzuć, aby spowić okolicę mrokiem."
    drop-protection: false
    effect:
      type: "DARKNESS_AOE"
      radius: 4.0
      affect-self: false
      effects:
        - potion: "BLINDNESS"
          duration-seconds: 3
          amplifier: 0
        - potion: "SLOWNESS"
          duration-seconds: 3
          amplifier: 0

  wind_charge:
    material: "WIND_CHARGE"
    name: "&6Wind Charge"
    lore: [ ]
    drop-protection: false
    effect:
      type: "WIND_CHARGE"

  hex_coin_1:
    material: "PAPER"
    name: "&6Hex-Coin&f(1)"
    lore:
      - "&f1 Hex-Coin (Kliknij PPM)"
    drop-protection: true
    effect:
      type: "HEX_COINS"
      coins: 1
      command-template: "eco give %player% %coins%"

  hex_coin_2:
    material: "PAPER"
    name: "&6Hex-Coinsy&f(2)"
