  teleport-lobby: "&aPrzeniesiono do lobby Parkour."
  teleport-arena: "&aPrzeniesiono na arene {arena}."

actionbar:
  enabled: true
  format: "&fCzas: &a{time}"
  not-started-format: "&fCzas: &7--:--.---"

placeholders:
  empty-name: "-"
  empty-time: "--:--.---"

timer:
  format: "mm:ss.SSS"

cooldowns:
  portal-trigger-ticks: 20
  reset-ticks: 10
  visibility-refresh-ticks: 20

sounds:
  checkpoint:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.35
  money:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.4
  start:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.3
  finish:
    enabled: true
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  reset:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.8
    pitch: 0.9

particles:
  checkpoint:
    enabled: true
    particle: DUST
    rgb:
      red: 170
      green: 60
      blue: 255
    size: 1.0
    density: 12
    interval-ticks: 10
  money:
    enabled: true
    particle: DUST
    rgb:
      red: 60
      green: 220
      blue: 90
    size: 1.0
    density: 14
    interval-ticks: 10

economy:
  fallback-command: "hexeconomy give {player} {amount}"
  currency: MONEY
  reason: "HexParkour money point {point}"

finish-reward:
  enabled: false
  command: "dajpunkt global {player} {amount}"
  arenas:
    wild_west:
      enabled: false
      max-time: "02:00.000"
      amount: 0
    glacier:
      enabled: false
      max-time: "02:30.000"
      amount: 0

