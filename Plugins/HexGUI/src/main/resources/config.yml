config-version: 3

# HexGUI - centralny hub menu
#
# Sloty są liczone od 0, tak jak w Bukkit:
# - 3 rzędy: 0-26
# - 4 rzędy: 0-35
# - 5 rzędów: 0-44
# - 6 rzędów: 0-53
#
# action: COMMAND - po kliknięciu wykonuje command
# action: NONE    - kafelek informacyjny, bez akcji po kliknięciu
#
# Każdy wpis COMMAND może wskazywać dowolną komendę gracza. Początkowy '/' jest opcjonalny.
# required-plugins jest sprawdzane zarówno przy rysowaniu menu, jak i ponownie przy kliknięciu.
# Gdy required-plugins jest puste, HexGUI nadal sprawdza faktycznego właściciela komendy Bukkit.

menu:
  title: "&0&lHEX CENTRUM"
  rows: 5

  filler:
    material: BLACK_STAINED_GLASS_PANE
    hide-tooltip: true

  unavailable-lore:
    - ""
    - "&cChwilowo niedostępne."
    - "&7Spróbuj ponownie za chwilę."

messages:
  player-only: "&cTa komenda jest dostępna tylko dla graczy."
  no-permission: "&cNie masz uprawnień do tej pozycji."
  unavailable: "&cTo menu jest chwilowo niedostępne. Spróbuj ponownie za chwilę."
  command-failed: "&cNie udało się otworzyć tego menu. Spróbuj ponownie za chwilę."
  reloaded: "&aKonfiguracja HexGUI została przeładowana."
  reload-failed: "&cNie udało się przeładować HexGUI. Sprawdź konsolę."

sounds:
  open: UI_BUTTON_CLICK
  unavailable: BLOCK_NOTE_BLOCK_BASS
  error: ENTITY_VILLAGER_NO

entries:
  town:
    enabled: true
    slot: 10
    name: "&6Miasto"
    lore:
      - "&7Centrum zarządzania miastem."
      - ""
      - "&eKliknij, aby otworzyć."
    command: "town"
    action: COMMAND
    run-as: PLAYER
    close-on-click: true
    required-plugins:
