# ==========================================================
# HexChests
# ==========================================================

enabled: true

messages:
  prefix: "&6&lHexChests &8> "
  no-permission: "&cNie masz uprawnień."
  player-only: "&cTa komenda jest dostępna tylko dla gracza."
  usage: "&7Użycie: &f/hexchests <reload|afkkey|epickey|premiumkey>"
  reload-success: "&aPrzeładowano konfigurację."
  reload-failed: "&cNie udało się przeładować konfiguracji. Sprawdź konsolę."
  key-given: "&aOtrzymałeś klucz: &f{key_name}"
  wrong-key-actionbar: "&cTen klucz nie pasuje do tej skrzyni."
  opening-started-actionbar: "&6Trwa losowanie..."
  reward-actionbar: "&6Otrzymano: &f{reward_name} x{amount}"
  inventory-full: "&eNie wszystko zmieściło się w ekwipunku."

sounds:
  preview:
    enabled: true
    name: "minecraft:ui.button.click"
    volume: 0.5
    pitch: 1.2
  wrong-key:
    enabled: true
    name: "minecraft:block.note_block.bass"
    volume: 0.6
    pitch: 0.7
  opening-tick:
    enabled: true
    name: "minecraft:block.note_block.hat"
    volume: 0.35
    pitch: 1.4
  reward:
    enabled: true
    name: "minecraft:ui.toast.challenge_complete"
    volume: 0.8
    pitch: 1.0

gui:
  size: 54
  preview-title: "{chest_name} &8- &lPodgląd"
  opening-title: "{chest_name} &8- &lLosowanie"
  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: ""
    lore: []
    hide-tooltip: true
  reward-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  info-slot: -1
  opening:
    size: 27
    duration-ticks: 80
    tick-interval-ticks: 1
    max-tick-interval-ticks: 4
    rolling-slot: 13
    result-slot: 13
    side-slots: [10, 11, 12, 14, 15, 16]
    indicator-slots: [4, 22]
    indicator-item:
      material: "LIME_STAINED_GLASS_PANE"
      name: ""
      lore: []
      hide-tooltip: true
    rolling-filler:
      material: "YELLOW_STAINED_GLASS_PANE"
      name: ""
      lore: []
      hide-tooltip: true

test-keys:
  enabled: true
  keys:
    afk:
      command: "afkkey"
      material: "TRIPWIRE_HOOK"
      custom-model-data: 1001
      display-name: "&eKlucz AFK"
      lore:
        - "&7Testowy klucz do Skrzyni AFK."
        - "&8hexchests:test-key"
    epic:
      command: "epickey"
      material: "TRIPWIRE_HOOK"
      custom-model-data: 1002
      display-name: "&5Epicki klucz"
      lore:
        - "&7Testowy klucz do Epickiej Skrzyni."
        - "&8hexchests:test-key"
    premium:
      command: "premiumkey"
      material: "TRIPWIRE_HOOK"
      custom-model-data: 1003
      display-name: "&cKlucz Premium"
      lore:
        - "&7Testowy klucz do Skrzyni Premium."
        - "&8hexchests:test-key"

