name: HexPortalConnect
version: '1.0'
main: pl.minecrafthex.hexportalconnect.HexPortalConnect
api-version: '1.21'
author: HEX
description: Portal z lobby na backend event przez Velocity

commands:
  hexconnect:
    description: Laczy wskazanego gracza (lub all) z wybranym serwerem backend.
    usage: /hexconnect <reload|<nazwaserwera> <gracz|all>>
    permission: hexportalconnect.admin
permissions:
  hexportalconnect.admin:
    description: Allows using /hexconnect command
    default: op
