disconnect.account-state-error: "&cTwoje konto jest w niespójnym stanie.\n&7Skontaktuj się z administracją."
disconnect.premium-check-unavailable: "&cNie można teraz zweryfikować statusu premium w Mojang.\n&7Spróbuj ponownie za kilka minut."
