# UWAGA: ten jeden komunikat jest wysyłany bezpośrednio przez wewnętrzny serwer poczekalni na
# poziomie protokołu, zanim Velocity przejmie połączenie. Kody "&" NIE są tu tłumaczone i
# pokazałyby się graczowi dosłownie – zostaw ten tekst bez kolorów.
