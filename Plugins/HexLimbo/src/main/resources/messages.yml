# Wiadomości HexLimbo. {0}, {1}, ... są zastępowane argumentami pozycyjnymi.
#
# KOLORY
# Wszystkie teksty widoczne dla gracza obsługują klasyczne kody kolorów Minecrafta z prefiksem "&"
# oraz kolory HEX w formacie "&#rrggbb". Obowiązujący schemat kolorów Hex:
#   &8 – tło, myślniki, elementy dyskretne     &7 – zwykły tekst i objaśnienia
#   &f – ważne wartości, komendy, wyróżnienia  &6 – kolor marki, nagłówki, "Hex"
#   &a – sukces                                &e – wskazówki i uwaga
#   &c – błędy                                 &b – oszczędnie, jako dodatkowy akcent
#   &l – pogrubienie (tylko duże tytuły i naprawdę ważne komunikaty)
#
# Nawiasy ostrokątne (np. <hasło>) są zwykłym tekstem i pozostają w pełni widoczne.
# Plik musi być zapisany w UTF-8, aby polskie znaki (ą ć ę ł ń ó ś ź ż) działały poprawnie.
# Zmiany w tym pliku wchodzą w życie po komendzie /hexlimbo reload.
#
# messages-version jest zarządzane przez HexLimbo. Starszy plik jest przy starcie migrowany w
# miejscu: brakujące klucze są dopisywane, wartości nadal zgodne z domyślnymi z poprzedniej wersji
# są odświeżane, a Twoje własne zmiany zostają zachowane. Najpierw powstaje jednorazowa kopia
# zapasowa (messages.yml.v<stara>.bak). Nie zmieniaj tego numeru ręcznie.
messages-version: 2

