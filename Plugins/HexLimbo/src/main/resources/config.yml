# HexLimbo configuration.
# Values that can be hot-reloaded with `/hexlimbo reload`:
#   servers.target, auth.*, session.* (duration / enabled live on every call;
#   purge-interval-minutes triggers a re-schedule), security.* (live except
#   rate-limit-per-minute window which is fixed at startup), premium.*, prompts.*,
#   messages.yml, limbo.actionbar-* (visual only).
# Restart-required: database.*, security.ip-hash-pepper, security.rate-limit-per-minute,
# limbo.server-name / bind-host / bind-port / spawn.* (these define the internal backend).

servers:
  # The server players are sent to once authenticated.
  target: "lobby"

# HexLimbo runs its own minimal internal backend server. There is no need to register
# an external "limbo" server in velocity.toml; HexLimbo registers itself dynamically.
limbo:
  # Name HexLimbo registers its backend under, both with the Velocity proxy and in routing.
  server-name: "hexlimbo-limbo"
  # Address the internal server binds to. 127.0.0.1 keeps it private to the proxy host.
  bind-host: "127.0.0.1"
  # TCP port for the internal server. Must be free and not exposed to the public internet.
  bind-port: 25580

  # Void spawn coordinates. There are no blocks, players free-fall into a configurable
  # spawn position and are repeatedly snapped back to it.
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

  # Visual-only: show an actionbar message reminding the player to /login or /register.
  # Default OFF in v1: the NBT TextComponent encoding for the action-bar packet is fragile
  # across 1.21.11 client builds. Re-enable once you've smoke-tested it against your client.
  actionbar-enabled: false
  actionbar-text: "Zaloguj się przez /login lub zarejestruj przez /register."

  # Toggle structured INFO-level logs around each step of the backend protocol handshake.
  # Useful for live-debugging "client disconnects right after joining limbo" reports. Logs each
  # transition (handshake protocol version, forwarding mode, login success sent, login
  # acknowledged received, known-packs sent/received, finish configuration sent/received, play
  # opening sequence sent). Leave off in normal operation; the logs are chatty.
  debug-protocol: false

  forwarding:
    # Velocity proxy → backend forwarding mode.
    #   MODERN  – backend sends a velocity:player_info Login Plugin Request and uses the
    #             forwarded UUID/username/IP. Matches velocity.toml
    #             player-info-forwarding-mode = "modern".
    #   LEGACY  – BungeeCord-style forwarding; the backend trusts the username in Login Start.
    #             Treated identically to NONE by the limbo today.
    #   NONE    – no handshake; the backend trusts the username in Login Start.
    mode: "MODERN"
    # Velocity forwarding secret (the contents of velocity/forwarding.secret). Required for HMAC
    # validation of the Login Plugin Response. Leave empty to SKIP HMAC validation – the limbo
    # still consumes the forwarded data, but no cryptographic proof of authenticity is enforced.
    # Skipping validation is acceptable when the limbo only listens on 127.0.0.1.
    secret: ""

auth:
  # How many seconds an unauthenticated player may stay connected before being kicked.
  login-timeout-seconds: 60
  # Permission node that bypasses the entire HexLimbo auth flow: full bypass means no limbo
  # routing, no chat block, no command block, no /login required, no login timeout.
  admin-bypass-permission: "hexlimbo.bypass"
  # Commands an unauthenticated player is allowed to run. Anything else is silently blocked.
  allowed-commands-unauthenticated:
    - "login"
    - "l"
    - "register"
    - "reg"
    - "limbo"
    - "premium"
    - "cpw"
    - "changepassword"
    - "logout"

database:
  host: "127.0.0.1"
  port: 3306
  database: "hexlimbo"
  username: "hexlimbo"
  password: ""
  pool-size: 10
  connection-timeout-ms: 10000
  socket-timeout-ms: 10000
  # Enable this when your MySQL server requires TLS or you use public hosting where credentials
  # should not cross the network in clear text.
  use-ssl: false
  # Needed for MySQL users that authenticate with sha256_password/caching_sha2_password without SSL.
  # If use-ssl is true, this can usually be false.
  allow-public-key-retrieval: true
  # When true (default, production-safe): if MySQL is unavailable at startup the plugin REFUSES to
  # serve auth and instead kicks every incoming connection with a "service unavailable" message.
  # When false: HexLimbo falls back to an in-memory account store. Accounts will NOT persist across
  # restarts; intended for development only. A loud warning is logged.
  fail-fast: true

session:
  # When enabled, players are remembered for `duration-minutes` and skip /login on rejoin.
  # Sessions are tied to the player's IP hash, so changing IP forces a fresh /login.
  enabled: true
  duration-minutes: 240
  # Background task interval for deleting expired sessions from MySQL.
  purge-interval-minutes: 10

security:
  min-password-length: 8
  max-failed-attempts: 5
  lockout-seconds: 600
  # Sliding window of login/register attempts per username per minute.
  # NOTE: this window is fixed at plugin startup; changing it via /hexlimbo reload has no effect
  # until the proxy restarts.
  rate-limit-per-minute: 6
  # Maximum accounts that can share a single hashed IP. Prevents bot registration storms.
  max-accounts-per-ip: 4
  # Per-instance pepper added before SHA-256 hashing of IPs. Change once and keep secret.
  # Rotating this invalidates session lookups (a known trade-off).
  ip-hash-pepper: "change-me-please-set-a-long-random-value"

premium:
  # When false, every player is treated as cracked. Useful for offline-only networks.
  enabled: true
  # How long Mojang premium-status results are cached. Only definite PREMIUM/NOT_PREMIUM
  # answers are cached; UNKNOWN responses are NEVER cached so the next caller retries upstream.
  cache-ttl-seconds: 600
  cache-max-entries: 10000
  http-timeout-ms: 4000
  # When the Mojang premium check returns UNKNOWN (network error, timeout, 5xx/429, malformed body)
  # the safe behaviour is to deny login/registration so a cracked client cannot grab a premium
  # name during a Mojang outage. Set to true ONLY if you accept that risk (e.g. closed networks).
  fail-open-on-check-error: false

prompts:
  # Master switch for the unauthenticated login/register prompts (BossBar, title, chat) shown to
  # players sitting in the limbo, plus the welcome shown after they authenticate. When false, the
  # limbo stays silent (players still see command feedback from /login and /register).
  enabled: true
  # Show a persistent BossBar reading e.g. "Zaloguj się: /login <hasło>".
  bossbar-enabled: true
  # Show a one-shot center-screen title + subtitle when the player enters the limbo and again on
  # successful authentication.
  title-enabled: true
  # Send the initial chat instruction and the periodic reminders below.
  chat-enabled: true
  # How often (seconds) to re-send the chat reminder while the player is unauthenticated. The
  # BossBar and title are NOT re-spammed; only the chat line repeats. Set 0 to disable reminders
  # (the player still gets one initial chat line). Requires chat-enabled: true.
  reminder-interval-seconds: 15
  # BossBar styling. color: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE.
  # overlay: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20. Invalid values fall back to
  # RED / PROGRESS. progress: 0.0-1.0 fill fraction.
  bossbar-color: "RED"
  bossbar-overlay: "PROGRESS"
  bossbar-progress: 1.0
  # Also show a title/subtitle on successful authentication and to premium players in the lobby.
  success-title-enabled: true
  # Greet premium / admin-bypass players who skipped the limbo with a short "limbo skipped" message
  # when they arrive in the target lobby.
  premium-skip-enabled: true
