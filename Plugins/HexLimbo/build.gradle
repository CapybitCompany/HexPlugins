plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'hex'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    testImplementation 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'

    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.yaml:snakeyaml:2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mindrot:jbcrypt:0.4'
    testImplementation 'org.yaml:snakeyaml:2.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName = "HexLimbo-${version}.jar"
    relocate 'org.mindrot.jbcrypt', 'hex.limbo.libs.bcrypt'
    relocate 'com.zaxxer.hikari', 'hex.limbo.libs.hikari'
    relocate 'com.mysql', 'hex.limbo.libs.mysql'
    relocate 'org.yaml.snakeyaml', 'hex.limbo.libs.snakeyaml'
    mergeServiceFiles()
    minimize {
        // MySQL Connector/J loads authentication plugins and protocol handlers by reflection.
        exclude(dependency('com.mysql:mysql-connector-j:.*'))
        // HikariCP also reflects on the pool config.
        exclude(dependency('com.zaxxer:HikariCP:.*'))
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
