name: HexPvPHandler
version: '1.0.0'
main: hexpvphandler.HexPvPHandlerPlugin
api-version: '1.21'
description: Blokada PvP z obsługą wyjątków i działającymi potionami
authors: [HexDevTeam]

commands:
  hex_blokujpvp:
    description: Blokuje PvP w obsługiwanych światach
    usage: /hex_blokujpvp
    permission: admin.blokujpvp
  hex_odblokujpvp:
    description: Odblokowuje PvP w obsługiwanych światach
    usage: /hex_odblokujpvp
    permission: admin.blokujpvp
  hex_pvpstatus:
    description: Pokazuje aktualny status blokady PvP
    usage: /hex_pvpstatus
    permission: admin.blokujpvp

permissions:
  admin.blokujpvp:
    description: Pozwala blokować i odblokowywać PvP
    default: op
