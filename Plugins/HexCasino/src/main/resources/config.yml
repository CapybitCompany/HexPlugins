slot-skill-machine:
  deterministic:
    reel-set-version: v1
    reel-set-count: 100
    per-player-cycle: true
    expose-reel-number: true
    allow-reel-preview: false

  # Five fixed paid variants. Min/max speed stay at 250/200 ms; middle variants are evenly interpolated.
  stakes:
    base-options: [1, 10, 20, 50, 100]

  difficulty-levels:
    default: normal
    normal:
      display-name: '1$'
      cost-multiplier: 1
      frame-ms: 250
      enabled: true
    low-mid:
      display-name: '10$'
      cost-multiplier: 10
      frame-ms: 238
      enabled: true
    hard:
      display-name: '20$'
      cost-multiplier: 20
      frame-ms: 225
      enabled: true
    high-mid:
      display-name: '50$'
      cost-multiplier: 50
      frame-ms: 213
      enabled: true
    expert:
      display-name: '100$'
      cost-multiplier: 100
      frame-ms: 200
      enabled: true

  rewards:
    normalize-by-pattern-count: true
    flint: 1.00
    melon_slice: 1.50
    gold_nugget: 2.00
    blaze_powder: 3.00
    amethyst_shard: 4.00
    emerald: 6.00
    diamond: 10.00
    nether_star: 16.00

  layout-payout-multipliers:
    one-line: 1.0
    3x3: 1.0
    5x3: 4.0

  daily-limits:
    timezone: Europe/Warsaw
    reset-at: '00:00'
    rewards-stop-threshold: 500
    pay-crossing-reward-in-full: true

  input-resolution:
    snapshot-history-ms: 5000
    guaranteed-network-delay-ms: 1000
    max-resolvable-delay-ms: 2000
    require-packet-state-id: true
    fail-closed-on-unmapped-state: true

  # Reward mode is enabled. Paid STOPs still require PacketEvents/stateId resolution.
  rewards-mode:
    enabled: true

  practice:
    enabled: false
    allow-current-set: false
    allow-set-selection: false
    payout-enabled: false

  production-gates:
    # Legacy documentary gates are retained for audit metadata but no longer block reward mode.
    paid-mode-enabled: false
    require-human-skill-validation: true
    human-skill-validated: false
    require-visual-stateid-validation: true
    visual-stateid-validated: false
    require-packet-lag-validation: true
    packet-lag-validated: false
    require-value-flow-review: true
    value-flow-reviewed: false
    require-ui-review: true
    ui-reviewed: false
    expert-enabled: true

