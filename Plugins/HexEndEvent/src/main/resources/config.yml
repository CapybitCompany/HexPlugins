event:
  # Lokalny safety switch modułu. Harmonogram, czas trwania i prepare-before
  # publicznego eventu są zarządzane WYŁĄCZNIE przez plugins/HexEvents/events.yml.
  enabled: true

  # Strefa służy tylko do formatowania starych komunikatów/placeholderów HexEndEvent.
  timezone: "Europe/Warsaw"

  # Pola poniżej są zachowane wyłącznie jako kompatybilność starego modelu konfiguracji.
  # Nie sterują lifecycle i mogą zostać usunięte w przyszłej wersji HexEndEvent.
  duration-minutes: 120
  prepare-before-minutes: 5
  schedule: []

access:
  block-all-end-environments: true
  bypass-permission: "hexendevent.bypass"
  blocked-message-cooldown-seconds: 3

world:
  end-world: "world_the_end"
  return-world: "world"
  reset-before-each-event: true
  seed-mode: "RANDOM"
  fixed-seed: 0
  unload-after-close: true

bossbar:
  # Aktywny BossBar widoczny graczom znajdującym się w Endzie.
  # Domyślnie pokazuje dokładną godzinę zamknięcia i odliczanie do końca eventu.
  enabled: true
  update-interval-ticks: 20
  color: "PURPLE"
  overlay: "PROGRESS"

runtime:
  state-file: "runtime.yml"
