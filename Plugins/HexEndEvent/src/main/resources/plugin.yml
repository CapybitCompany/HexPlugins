name: HexEndEvent
version: 1.0.0
main: hex.endevent.HexEndEventPlugin
api-version: "1.21"
author: Havix

depend:
  - HexCore

softdepend:
  - HexEvents
  - PlaceholderAPI

commands:
  endevent:
    usage: "/endevent"
    description: Informacje o cyklicznym evencie Endu
    permission: hexendevent.use

permissions:
  hexendevent.use:
    default: true
  hexendevent.admin:
    default: op
  hexendevent.bypass:
    default: op
