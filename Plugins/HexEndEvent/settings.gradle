rootProject.name = 'HexEndEvent'

// Standalone build support for the layouts used by the HexPlugins repository.
def hexCoreDir = [
        file('../HexCore'),
        file('../../HexCore')
].find { new File(it, 'build.gradle').isFile() }

if (hexCoreDir == null) {
    throw new GradleException('HexEndEvent: cannot find HexCore. Expected ../HexCore or ../../HexCore relative to HexEndEvent.')
}

include ':plugins:HexCore'
project(':plugins:HexCore').projectDir = hexCoreDir

// HexEndEvent compiles against the contracts owned by HexEvents. The API is a
// source project, so HexEvents itself does not have to be built first, but the
// HexEvents/hexevents-api directory must be present in the checkout.
def hexEventsApiDir = [
        file('../HexEvents/hexevents-api'),
        file('../../HexEvents/hexevents-api')
].find { new File(it, 'build.gradle').isFile() }

if (hexEventsApiDir == null) {
    throw new GradleException('HexEndEvent: cannot find HexEvents API. Expected ../HexEvents/hexevents-api or ../../HexEvents/hexevents-api relative to HexEndEvent.')
}

include ':hexevents-api'
project(':hexevents-api').projectDir = hexEventsApiDir
