# ==========================================================
# HexAfkZone
# ==========================================================

enabled: true

region:
  world: "world"
  corner-1:
    x: 2786
    y: 72
    z: 952
  corner-2:
    x: 2782
    y: 81
    z: 965

messages:
  prefix: "&6&lAFK Zone &8> "
  no-permission: "&cNie masz uprawnien."
  usage: "&7Uzycie: &f/hexafkzone reload"
  reload-success: "&aPrzeladowano konfiguracje."
  reload-failed: "&cNie udalo sie przeladowac konfiguracji. Sprawdz konsole."
  zone-subtitle: "{color}STREFA AFK"
  timer-actionbar: "{color}Jestes AFK od: &f{time} &8| &7Nagroda za: &f{next_reward_in}"
  reward-actionbar: "{color}Otrzymales: &a{base_reward}&7{bonus_rewards}"

reward-message-seconds: 3

sounds:
  reward:
    enabled: true
    name: "minecraft:ui.toast.challenge_complete"
    volume: 0.8
    pitch: 1.0

# Profile decyduja o kolorze komunikatow oraz czasie miedzy cyklicznymi nagrodami.
# Operatorzy oraz osoby z hexafkzone.admin przyjmuja profil admin.
rank-profiles:
  default:
    display-name: "Default"
    color: "&7"
    reward-interval: "10m"
    priority: 0
    fallback-access: true
    operator-access: false
    permissions:
      - "hexafkzone.rank.default"
      - "group.default"
  vip:
    display-name: "VIP"
    color: "&e"
    reward-interval: "9m"
    priority: 20
    fallback-access: false
    operator-access: false
    permissions:
      - "hexafkzone.rank.vip"
      - "group.vip"
  svip:
    display-name: "SVIP"
    color: "&6"
    reward-interval: "8m"
    priority: 30
    fallback-access: false
    operator-access: false
    permissions:
      - "hexafkzone.rank.svip"
      - "group.svip"
  elite:
    display-name: "Elita"
    color: "&b"
    reward-interval: "6m"
    priority: 40
    fallback-access: false
    operator-access: false
    permissions:
      - "hexafkzone.rank.elita"
      - "hexafkzone.rank.elite"
      - "group.elita"
      - "group.elite"
  media:
    display-name: "Media"
    color: "&d"
    reward-interval: "6m"
    priority: 45
    fallback-access: false
    operator-access: false
    permissions:
      - "hexafkzone.rank.media"
      - "group.media"
  admin:
    display-name: "Admin"
    color: "&c"
    reward-interval: "6m"
    priority: 50
    fallback-access: false
    operator-access: true
    permissions:
      - "hexafkzone.admin"
      - "hexafkzone.rank.admin"
      - "group.admin"

# Nagrody sa przyznawane cyklicznie po czasie z profilu gracza.
# base zawsze wpada, chance sa losowane niezaleznie od siebie przy kazdej wyplacie.
rewards:
  base:
    display-name: "20$"
    amount: 20
    commands:
      - "hexeconomy add {player} 20"
  chance:
    afk_key:
      display-name: "&eKlucz AFK"
      chance-percent: 50.0
      amount: 1
      commands:
        - "hexcustomitem afk_key {player} 1"
    epic_key:
      display-name: "&5Epicki klucz"
      chance-percent: 2.0
      amount: 1
      commands:
        - "hexcustomitem epic_key {player} 1"
    premium_key:
      display-name: "&cKlucz Premium"
      chance-percent: 0.1
      amount: 1
      commands:
        - "hexcustomitem premium_key {player} 1"
