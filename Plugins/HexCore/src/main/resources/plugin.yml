name: HexCore
version: 0.0.2
main: hex.core.HexCore
api-version: "1.21"
author: Havix
softdepend:
  - PlaceholderAPI

# Paper/Purpur runtime libraries. Dzięki temu HexCore działa także wtedy,
# gdy na serwer trafi zwykły JAR bez wbudowanych zależności Shadow.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:9.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
  - org.xerial:sqlite-jdbc:3.47.2.0

commands:
  hexcore:
    description: HexCore version and reload commands
    usage: /hexcore reload <ui|flags|db|all>
  hexdebugdb:
    description: Debug DB read for coins and ranking points
    usage: /hexdebugdb
    permission: hexcore.debugdb
  region:
    description: Manage regions (cuboids)
    usage: /region
    permission: hexcore.region
  uitpl:
    description: Send UI templates with positional arguments
    usage: /uitpl <all|gracz> <template> [args...]
    permission: hexcore.ui.send
  hexcoinscache:
    description: Invalidate/refresh coins cache by player name
    usage: /taw komend przy kupowaniu  <invalidate|refresh> <playerName>
    permission: hexcore.cache.coins

permissions:
  hexcore.region:
    default: op
  hexcore.ui.send:
    default: op
  hexcore.debugdb:
    default: op
  hexcore.cache.coins:
    default: op
  hexcore.reload:
    default: op
