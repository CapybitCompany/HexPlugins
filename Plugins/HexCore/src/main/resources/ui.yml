prefix: "<gray>[</gray><gold><bold>HEX</bold></gold><gray>]</gray> "

# Optional per-namespace chat prefixes, e.g. elimination/drawn/iceberg.
prefixes:
  towns: "<gray>[</gray><green><bold>TOWNS</bold></green><gray>]</gray> "

# Admin overrides that win over runtime plugin defaults.
overrides: {}

# Optional composed actions for api.ui().sendPreset(...)
presets:
  core.reload.ok:
    chat: "core.reload.ok"
    chatBroadcast: false
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    soundBroadcast: false
    volume: 1.0
    pitch: 1.0

templates:
  # Actionbar w poczekalni (czeka na min)
  lobby.actionbar.waiting: "<gold><bold><game></bold></gold> <gray>|</gray> <white>Graczy:</white> <yellow><current></yellow><gray>/</gray><yellow><max></yellow> <gray>|</gray> <white>Minimum:</white> <red><min></red>"

  # Actionbar podczas odliczania (opcjonalnie inny)
  lobby.actionbar.countdown: "<gold><bold><game></bold></gold> <gray>|</gray> <white>Start za:</white> <yellow><seconds>s</yellow> <gray>|</gray> <white>Graczy:</white> <yellow><current></yellow><gray>/</gray><yellow><max></yellow>"

  # Subtitle do Title podczas countdown
  lobby.countdown.subtitle: "<yellow><bold>Start za <seconds>...</bold></yellow>"

  # Wiadomości ogólne
  core.reload.ok: "<green>Przeładowano konfigurację: <white><id></white></green>"
  core.reload.fail: "<red>Błąd przeładowania: <white><id></white></red>"

  # Szablony pod jedną komendę i różną liczbę argumentów
  core.echo: "<aqua><text></aqua>"
  core.minigame.score: "<gold><player></gold><gray>: </gray><yellow><score></yellow><gray>/</gray><yellow><max></yellow>"

  test.message: "<green>To jest testowa wiadomość!"
  test.action: "<gold><bold>Actionbar działa!</bold></gold>"
  test.subtitle: "<yellow><bold>Subtitle działa!</bold></yellow>"

  # HexElimination
  elimination.kill.announce: "<dark_gray>[<red><bold>ELIMINACJA</bold></red>]</dark_gray> <white>Gracz</white> <yellow><victim></yellow> <white>został</white> <red><bold>WYELIMINOWANY</bold></red><white>!</white>"
  elimination.resurect.announce: "<dark_gray>[<green><bold>WSKRZESZENIE</bold></green>]</dark_gray> <white>Gracz</white> <yellow><target></yellow> <white>został wskrzeszony przez</white> <aqua><by></aqua><white>.</white>"
  elimination.resurect.ok: "<green>Wskrzeszono gracza: <white><target></white></green>"
  elimination.resurect.usage: "<yellow>Użycie: <white>/hexelimination resurect [nick_gracza]</white></yellow>"
  elimination.error.not_eliminated: "<red>Ten gracz nie jest wyeliminowany.</red>"
  elimination.error.player_not_found: "<red>Nie znaleziono gracza: <white><nick></white></red>"
  elimination.resurectall.announce: "<dark_gray>[<green><bold>WSKRZESZENIE</bold></green>]</dark_gray> <aqua><by></aqua> <white>wskrzesił wszystkich wyeliminowanych graczy (<yellow><count></yellow>). Tryb: <yellow><gamemode></yellow></white>"
  elimination.resurectall.ok: "<green>Wskrzeszono <white><count></white> graczy.</green>"
  elimination.resurectall.empty: "<yellow>Lista wyeliminowanych graczy jest już pusta.</yellow>"
  elimination.resurectall.usage: "<yellow>Użycie: <white>/hexelimination resurectall [survival|creative|adventure|spectator]</white></yellow>"
  elimination.resurectall.invalid_gamemode: "<red>Nieznany tryb gry: <white><input></white>. Dostępne: <yellow>survival, creative, adventure, spectator</yellow>.</red>"
  elimination.toggle.started: "<dark_gray>[<gold><bold>ELIMINACJA</bold></gold>]</dark_gray> <green>Okres eliminacji <bold>ROZPOCZĘTY</bold></green> <gray>przez</gray> <aqua><by></aqua><white>.</white>"
  elimination.toggle.stopped: "<dark_gray>[<gold><bold>ELIMINACJA</bold></gold>]</dark_gray> <red>Okres eliminacji <bold>ZAKOŃCZONY</bold></red> <gray>przez</gray> <aqua><by></aqua><white>.</white>"
  elimination.toggle.already_started: "<yellow>Okres eliminacji jest już aktywny.</yellow>"
  elimination.toggle.already_stopped: "<yellow>Okres eliminacji jest już nieaktywny.</yellow>"
  elimination.toggle.usage: "<yellow>Użycie: <white>/hexelimination [start|stop]</white></yellow>"
  elimination.reload.ok: "<green><bold>HexElimination</bold></green><gray>:</gray> <white>konfiguracja została przeładowana.</white>"
  elimination.usage: "<yellow>Użycie: <white>/hexelimination [resurect|resurectall|start|stop|reload]</white></yellow>"

