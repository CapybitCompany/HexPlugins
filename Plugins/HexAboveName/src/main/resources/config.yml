title-system:
  enabled: true
  # ADAPTIVE = gracze w ruchu są aktualizowani często, stojący rzadko sprawdzani
  # ALWAYS = wszyscy gracze są aktualizowani zawsze w tym samym interwale
  update-mode: "ADAPTIVE"
  # Wysokość napisu nad głową gracza
  y-offset: 2.40
  # Minimalny próg ruchu (w blokach), aby uznać gracza za poruszającego się
  movement-threshold: 0.015
  # Interwał aktualizacji dla graczy w ruchu (ticki)
  moving-update-interval-ticks: 1
  # Interwał rzadkich kontroli dla graczy stojących (ticki)
  idle-check-interval-ticks: 12
  # Czas teleportacji encji TextDisplay (ticki)
  teleport-duration-ticks: 1
  # Czas interpolacji ruchu TextDisplay (ticki)
  interpolation-duration-ticks: 2
  # Czy włączyć cień pod tekstem
  shadowed: true
  # Czy gracz ma widzieć swój własny tytuł
  show-to-self: true
  # Domyślny tytuł, gdy brak wpisu w storage (puste = brak tytułu)
  default-title: ""

worlds:
  use-whitelist: false
  whitelist:
    - world

storage:
  # Dostępne typy: YAML | MYSQL
  type: "MYSQL"

  # Co ile sekund odświeżać dane z backendu.
  refresh-interval-seconds: 15

  yaml:
    file: "users.yml"

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "minecraft_network"
    username: "mc_user"
    password: "change_me"
    table: "player_display_texts"

    columns:
      player: "player"
      uuid: "uuid"
      text: "string"

    pool:
      max-size: 10
      min-idle: 2
      timeout-ms: 5000
      lifetime-ms: 1800000

    options:
      use-ssl: false
      server-timezone: "UTC"

messages:
  prefix: "&0&l[&4&lHEX&0&l]&7 "
  reloaded: "&aPrzeładowano plugin HexAboveName."
  reload-failed: "&cNie udało się przeładować pluginu. Sprawdź konsolę."
  no-permission: "&cNie masz uprawnień."
  usage: "&cUżycie: /<label> <reload|set|clear>"
  player-not-found: "&cNie znaleziono gracza: &e<player>&c."
  title-set: "&aUstawiono tytuł dla &e<player>&a: &f<title>"
  title-cleared: "&aUsunięto tytuł dla &e<player>&a."
  title-too-long: "&cTytuł jest za długi. Maksymalnie &e<max>&c znaków."
  storage-write-failed: "&cNie udało się zapisać zmian. Sprawdź konsolę."

limits:
  max-title-length: 255
