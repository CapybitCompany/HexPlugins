# ==========================================================
# HexDailyRewards
# ==========================================================

enabled: true
config-version: 6

daily-reset:
  # Nagroda resetuje sie po zmianie dnia w tej strefie czasowej.
  # Przyklad: odbior w poniedzialek 23:59 pozwala odebrac kolejna nagrode we wtorek 00:00.
  time-zone: "Europe/Warsaw"

hexnpc:
  # HexDailyRewards nie zmienia HexNPC. Rejestruje tylko typ akcji w ServicesManager.
  # W NPC ustaw akcje o takim typie, np. hexdailyrewards.
  enabled: true
  action-id: "hexdailyrewards"

time-format:
  now: "teraz"
  hour: "h"
  minute: "min"
  second: "s"
  reset-time-pattern: "HH:mm"
  date-pattern: "dd.MM.yyyy"

messages:
  prefix: "&c&lDaily Rewards &8> "
  no-permission: "&cNie masz uprawnien."
  player-only: "&cTa komenda jest dostepna tylko dla gracza."
  usage: "&7Uzycie: &f/hexdailyrewards reload"
  reload-success: "&aPrzeladowano konfiguracje."
  reload-failed: "&cNie udalo sie przeladowac konfiguracji. Sprawdz konsole."
  disabled: "&cDaily Rewards sa obecnie wylaczone."
  reward-claimed-chat: "&aOdebrales dzisiejsza nagrode z kategorii &f{group_name}&a."
  reward-claimed-actionbar: "&aOdebrano nagrode: &f{reward_name}"
  already-claimed-actionbar: "&eTa kategoria jest juz odebrana. Wroc za &6{time}&e."
  reward-locked-actionbar: "&cTa skrzynka nie jest dostepna dla twojej rangi."
  claim-error: "&cNie udalo sie zapisac odbioru nagrody. Zglos to administracji."
  no-reward-configured: "&cBrak skonfigurowanej nagrody na dzisiaj."

placeholders:
  # PlaceholderAPI:
  # %hexdailyrewards_time% -> np. 5h 24min albo teraz
  # %hexdailyrewards_hours% -> sama liczba godzin
  # %hexdailyrewards_minutes% -> sama liczba minut
  # %hexdailyrewards_status% -> status-available/status-claimed
  # %hexdailyrewards_player_status% -> player-status-available/player-status-claimed, per gracz
  # %hexdailyrewards_available% -> available/unavailable
  # %hexdailyrewards_reward_name%, %hexdailyrewards_reward_day%, %hexdailyrewards_reward_id%
  # %hexdailyrewards_group_name%, %hexdailyrewards_group_ranks%
  # Jedna linijka hologramu liczona per gracz:
  # %hexdailyrewards_hologram_status%
  no-player: "-"
  no-reward: "-"
  available: "true"
  unavailable: "false"
  status-available: "Do odebrania"
  status-claimed: "Odebrane"
  player-status-available: "&aDo odebrania"
  player-status-claimed: "&cOdebrano"
  hologram-status-available: "&aDo odebrania"
  hologram-status-claimed: "&cOdebrano"

sounds:
  open:
    enabled: true
    name: "minecraft:ui.button.click"
    volume: 0.6
    pitch: 1.2
  claim:
    enabled: true
    name: "minecraft:entity.player.levelup"
    volume: 0.8
    pitch: 1.0
  unavailable:
    enabled: true
    name: "minecraft:block.note_block.bass"
    volume: 0.6
    pitch: 0.8

reward:
  close-gui-after-claim: false
  refresh-gui-after-claim: true

reward-groups:
