# ==========================================================
# HexDailyRewards
# ==========================================================

enabled: true
config-version: 2

daily-reset:
  # Nagroda resetuje sie po zmianie dnia w tej strefie czasowej.
  # Przyklad: odbior w poniedzialek 23:59 pozwala odebrac kolejna nagrode we wtorek 00:00.
  time-zone: "Europe/Warsaw"

hexnpc:
  # HexDailyRewards nie zmienia HexNPC. Rejestruje tylko typ akcji w ServicesManager.
  # W NPC ustaw akcje o takim typie, np. hexdailyrewards.
  enabled: true
  action-id: "hexdailyrewards"

time-format:
  now: "teraz"
  hour: "h"
  minute: "min"
  second: "s"
  reset-time-pattern: "HH:mm"
  date-pattern: "dd.MM.yyyy"

messages:
  prefix: "&c&lDaily Rewards &8> "
  no-permission: "&cNie masz uprawnień."
  player-only: "&cTa komenda jest dostępna tylko dla gracza."
  usage: "&7Użycie: &f/hexdailyrewards reload"
  reload-success: "&aPrzeładowano konfigurację."
  reload-failed: "&cNie udało się przeładować konfiguracji. Sprawdź konsolę."
  disabled: "&cDaily Rewards są obecnie wyłączone."
  reward-claimed-chat: "&aOdebrałeś dzisiejszą nagrodę."
  reward-claimed-actionbar: "&aOdebrano codzienną nagrodę!"
  already-claimed-actionbar: "&eDzisiejsza nagroda została już odebrana. Wróć za &6{time}&e."
  claim-error: "&cNie udało się zapisać odbioru nagrody. Zgłoś to administracji."
  no-reward-configured: "&cBrak skonfigurowanej nagrody na dzisiaj."

placeholders:
  # PlaceholderAPI:
  # %hexdailyrewards_time% -> np. 5h 24min albo teraz
  # %hexdailyrewards_hours% -> sama liczba godzin
  # %hexdailyrewards_minutes% -> sama liczba minut
  # %hexdailyrewards_status% -> status-available/status-claimed
  # %hexdailyrewards_player_status% -> player-status-available/player-status-claimed, per gracz
  # %hexdailyrewards_available% -> available/unavailable
  # %hexdailyrewards_reward_name%, %hexdailyrewards_reward_day%, %hexdailyrewards_reward_id%
  no-player: "-"
  no-reward: "-"
  available: "true"
  unavailable: "false"
  status-available: "Do odebrania"
  status-claimed: "Odebrane"
  player-status-available: "&aDo odebrania"
  player-status-claimed: "&cOdebrany"

sounds:
  open:
    enabled: true
    name: "minecraft:ui.button.click"
    volume: 0.6
    pitch: 1.2
  claim:
    enabled: true
    name: "minecraft:entity.player.levelup"
    volume: 0.8
    pitch: 1.0
  unavailable:
    enabled: true
    name: "minecraft:block.note_block.bass"
    volume: 0.6
    pitch: 0.8

reward:
  close-gui-after-claim: false
  refresh-gui-after-claim: true

rewards-calendar:
  # Cykl startuje od tej daty. day-1 przypada na start-date.
  start-date: "2026-07-20"
  # 14 dni = dwa tygodnie. Po day-14 plugin wraca do day-1.
  cycle-days: 14
  # Uzywane, gdy konkretna nagroda ma puste lore albo nie ma lore wcale.
  default-lore:
    - "&7Nagroda dnia: &f{reward_name}"

  # Placeholdery w komendach:
  # {player}, {uuid}, {date}, {last_date}, {time}, {reset_time},
  # {reward_id}, {reward_day}, {reward_name}
  days:
    day-1:
      display-name: "&bDiamentowy start"
      material: "DIAMOND"
      lore:
        - "&7Nagroda dnia: &f1x Diament"
      commands:
        - "give {player} diamond 1"
    day-2:
      display-name: "&aSzmaragdowy bonus"
      material: "EMERALD"
      lore:
        - "&7Nagroda dnia: &f3x Szmaragd"
      commands:
        - "give {player} emerald 3"
    day-3:
      display-name: "&6Złote wsparcie"
      material: "GOLD_INGOT"
      lore:
        - "&7Nagroda dnia: &f8x Złoto"
      commands:
        - "give {player} gold_ingot 8"
    day-4:
      display-name: "&9Lapisowy pakiet"
      material: "LAPIS_LAZULI"
      lore:
        - "&7Nagroda dnia: &f16x Lapis"
      commands:
        - "give {player} lapis_lazuli 16"
    day-5:
      display-name: "&eDoświadczenie"
      material: "EXPERIENCE_BOTTLE"
      lore:
        - "&7Nagroda dnia: &f16x Butelka expa"
      commands:
        - "give {player} experience_bottle 16"
    day-6:
      display-name: "&dKryształowy drop"
      material: "AMETHYST_SHARD"
      lore:
        - "&7Nagroda dnia: &f12x Ametyst"
      commands:
        - "give {player} amethyst_shard 12"
    day-7:
      display-name: "&6Tygodniowa skrzynia"
      material: "CHEST"
      lore:
        - "&7Nagroda dnia: &f1x Skrzynia"
      commands:
        - "give {player} chest 1"
    day-8:
      display-name: "&fŻelazny zapas"
      material: "IRON_INGOT"
      lore:
        - "&7Nagroda dnia: &f16x Żelazo"
      commands:
        - "give {player} iron_ingot 16"
    day-9:
      display-name: "&2Rolniczy pakiet"
      material: "HAY_BLOCK"
      lore:
        - "&7Nagroda dnia: &f8x Siano"
      commands:
        - "give {player} hay_block 8"
    day-10:
      display-name: "&cPył redstone"
      material: "REDSTONE"
      lore:
        - "&7Nagroda dnia: &f24x Redstone"
      commands:
        - "give {player} redstone 24"
    day-11:
      display-name: "&3Morski pakiet"
      material: "PRISMARINE_SHARD"
      lore:
        - "&7Nagroda dnia: &f12x Pryzmaryn"
      commands:
        - "give {player} prismarine_shard 12"
    day-12:
      display-name: "&5Endowy dodatek"
      material: "ENDER_PEARL"
      lore:
        - "&7Nagroda dnia: &f4x Perła endu"
      commands:
        - "give {player} ender_pearl 4"
    day-13:
      display-name: "&eTNT zabawa"
      material: "TNT"
      lore:
        - "&7Nagroda dnia: &f4x TNT"
      commands:
        - "give {player} tnt 4"
    day-14:
      display-name: "&bFinał cyklu"
      material: "NETHERITE_SCRAP"
      lore:
        - "&7Nagroda dnia: &f1x Netherite Scrap"
      commands:
        - "give {player} netherite_scrap 1"

  # Specjalne nagrody na konkretne daty. Maja priorytet nad cyklem day-1..day-14.
  date-overrides:
    "2026-12-24":
      display-name: "&cŚwiąteczna nagroda"
      material: "CHEST"
      lore:
        - "&7Nagroda specjalna za dzisiejszy dzień."
      commands:
        - "give {player} diamond 5"

gui:
  title: "&cDaily Rewards"
  size: 27

  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: ""
    lore: []
    hide_tooltip: true

  items:
    available:
      enabled: true
      slot: 13
      material: "CHEST"
      use-reward-material: true
      name: "{reward_name}"
      lore:
        - "{reward_lore}"
    claimed:
      enabled: true
      slot: 13
      material: "MINECART"
      use-reward-material: true
      name: "{reward_name}"
      lore:
        - "{reward_lore}"
    status-available:
      enabled: true
      slot: 26
      material: "LIME_DYE"
      name: "&fStatus: &aDo odebrania"
      lore:
        - "&7Do następnej nagrody: &f{time}"
    status-claimed:
      enabled: true
      slot: 26
      material: "RED_DYE"
      name: "&fStatus: &cOdebrane"
      lore:
        - "&7Do następnej nagrody: &f{time}"
    close:
      enabled: true
      slot: 18
      material: "BARRIER"
      name: "&cZamknij"
      lore: []
