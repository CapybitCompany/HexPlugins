gui:
  title: "&cDaily Rewards"
  size: 45

  filler:
    material: "BLACK_STAINED_GLASS_PANE"
    name: ""
    lore: []
    hide_tooltip: true

  items:
    available:
      enabled: true
      slot: 13
      material: "CHEST"
      use-reward-material: true
      name: "{group_name}"
      lore:
        - "&fNagroda: {reward_name}"
        - ""
        - "&fStatus: {player_status}"
        - "&fNastepna nagroda za: {time}"
    claimed:
      enabled: true
      slot: 13
      material: "MINECART"
      use-reward-material: true
      name: "{group_name}"
      lore:
        - "&fNagroda: {reward_name}"
        - ""
        - "&fStatus: {player_status}"
        - "&fNastepna nagroda za: {time}"
    locked:
      enabled: true
      slot: 13
      material: "GRAY_DYE"
      use-reward-material: true
      name: "{group_name}"
      lore:
        - "&fNagroda: {reward_name}"
        - ""
        - "&fStatus: &cNiedostepna"
        - "&fNastepna nagroda za: -"
    status-available:
      enabled: false
      slot: 31
      material: "LIME_DYE"
      name: "&fStatus: &aDo odebrania"
      lore:
        - "&7Do nastepnego resetu: &f{time}"
    status-claimed:
      enabled: false
      slot: 31
      material: "RED_DYE"
      name: "&fStatus: &cOdebrane"
      lore:
        - "&7Do nastepnej nagrody: &f{time}"
    info:
