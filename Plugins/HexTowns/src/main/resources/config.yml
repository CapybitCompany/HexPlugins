towns:
  world-whitelist: ["world"]

  size:
    initial-radius: 1
    max-chunks: 49
    buffer-chunks-between-towns: 1

  creation:
    min-distance-chunks: 10
    cost-coins: 0
    confirm-required: true

  naming:
    # Domyślna nazwa miasta, gdy gracz użyje /town create bez nazwy.
    # Dostępny token: {number}.
    default-template: "Town {number}"
    max-length: 16

  coop:
    max-members: 3
    request-ttl-seconds: 120

  protection:
    block-place: true
    block-break: true
    interact-containers: true
    interact-doors: false
    pvp: false
    explosion: true
    fire-spread: true
    item-pickup-window-seconds: 60

  growth:
    starting-points: 0
    sync:
      enabled: true
      # Co ile ticków HexTowns ma pobrać z DB aktualne growth_points do cache w pamięci.
      # 200 ticków = ok. 10 sekund. Ustaw 0/false przez enabled, jeśli chcesz tylko ręczny sync admina.
      interval-ticks: 200

  map:
    # Promień chunków rysowany na mapie z /town map.
    radius-chunks: 8
    # Zabezpieczenia przed farmieniem nieskończonej liczby itemów mapy.
    cooldown-seconds: 30
    prevent-duplicates: true


  heart:
    # Flaga testowa: pozwala postawić Serce Miasta, gdy gracz ma już miasto,
    # ale miasto nie ma jeszcze przypiętego serca. Domyślnie true na czas testów.
    allow-existing-town-placement-for-tests: true
    item:
      material: RED_CONCRETE
      display-name: "&cSerce miasta"
    # Serce czyści centralny chunk od poziomu y_serca-1 do góry i blokuje budowanie
    # w tym zakresie. Bloki wolno kłaść tylko poniżej y_serca-1.
    clear-chunk-above-heart: true

  visual-check:
    enabled: true
    block: "LIME_CONCRETE"
    radius-chunks: 6
    # Co ile tickow sprawdzamy, czy gracz zmienil chunk i trzeba przerysowac granice.
    # 40 tickow = ok. 2 sekundy.
    refresh-ticks: 40
    # Co ile tickow WYMUSZAMY pelne przerysowanie stanu miasta (nowe/zniszczone claimy),
    # nawet jesli gracz stoi w tym samym chunku. Rzadziej = mniej pakietow i mniejsze zuzycie zasobow.
    # 200 tickow = ok. 10 sekund. Ustaw 0, zeby wylaczyc wymuszone odswiezanie stanu.
    state-refresh-ticks: 200
    pillar-height: 18
    # Granice pionowe zaczynaja sie od minimalnego Y swiata.
    # Dzieki temu /town check jest widoczny takze podczas kopania pod ziemia.
    extend-to-world-min: true
    # Oprocz czterech rogowych slupkow rysuj tez cienkie pionowe sciany-krawedzie
    # wzdluz calej granicy chunka od min Y do gornego poziomu ramki.
    vertical-edge-walls: true
    # /town check uzywa teraz efemerycznych BlockDisplay zamiast podmienianych blokow.
    # To daje mniej obiektow do renderowania i blokuje jakiekolwiek farmienie materialu Silk Touchem.
    # Szerokosc pionowych slupkow oraz poziomych krawedzi chunka. 0.15 = waska linia.
    display-width: 0.15
    # Grubosc gornych krawedzi ramki.
    edge-thickness: 0.15
    # Zasieg widocznosci displayow dla gracza.
    display-view-range: 64
    # Limit tworzonych displayow na tick dla wszystkich graczy z wlaczonym /town check.
    max-block-displays-per-tick-global: 20000

  destroy:
    confirm-window-seconds: 30
    publish-reset-event: true
    purge-grace-seconds: 60

  cache:
    town-cache-size: 5000
    member-cache-size: 1000
    metrics-enabled: true

  scale:
    growth-flush-interval-ms: 1000
    meta-flush-interval-ms: 250
    coop-request-purge-interval-seconds: 300
    distance-check-bucket-size: 16