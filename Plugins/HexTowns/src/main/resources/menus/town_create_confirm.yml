# DeluxeMenus: potwierdzenie założenia miasta

menu_title: '&2Potwierdź założenie miasta'
size: 27

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '
    slots:
      - 0-26

  info:
    material: EMERALD_BLOCK
    slot: 13
    display_name: '&aZałożenie miasta'
    lore:
      - '&7Jeśli poprzedni klik przeszedł walidację,'
      - '&7masz teraz aktywne potwierdzenie /town create.'
      - ''
      - '&7Startowy rozmiar: &f%hextowns_create_initial_chunks% chunków'
      - '&7Min. dystans: &f%hextowns_create_min_distance% chunków'
      - ''
      - '&cUwaga: późniejsze odejście/zniszczenie miasta'
      - '&cmoże resetować statystyki zgodnie z pluginami SMP.'

  confirm:
    material: LIME_CONCRETE
    slot: 11
    display_name: '&aPotwierdź'
    lore:
      - '&7Wykonuje: &f/town create confirm'
      - '&7Po udanym utworzeniu wrócisz do menu miasta.'
    view_requirement:
      requirements:
        no_town:
          type: string equals
          input: '%hextowns_has_town%'
          output: 'false'
    left_click_commands:
      - '[player] town create confirm'
      - '[openguimenu] town_main'

  already_created:
    material: BELL
    slot: 11
    display_name: '&eMasz już miasto'
    lore:
      - '&7Ikona zakładania zniknęła, bo należysz do miasta.'
      - '&7Przejdź do panelu zarządzania.'
    view_requirement:
      requirements:
        has_town:
          type: string equals
          input: '%hextowns_has_town%'
          output: 'true'
    left_click_commands:
      - '[openguimenu] town_manage'

  cancel:
    material: RED_CONCRETE
    slot: 15
    display_name: '&cAnuluj'
    lore:
      - '&7Wraca do głównego menu bez potwierdzania.'
    left_click_commands:
      - '[openguimenu] town_main'

