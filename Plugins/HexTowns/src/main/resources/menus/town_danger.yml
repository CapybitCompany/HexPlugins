# DeluxeMenus: strefa ryzyka HexTowns

menu_title: '&4Miasto &8- strefa ryzyka'
open_command:
  - towndanger
size: 45

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '
    slots:
      - 0-44

  warning:
    material: REDSTONE_TORCH
    slot: 4
    display_name: '&cUwaga'
    lore:
      - '&7Miasto: &e%hextowns_town_name%'
      - '&7Rola: &f%hextowns_role_display%'
      - ''
      - '&cAkcje w tym menu mogą resetować statystyki'
      - '&ci dane powiązane z miastem w innych pluginach.'

  destroy:
    material: TNT
    slot: 20
    display_name: '&4Zniszcz miasto'
    lore:
      - '&7Dostępne tylko dla właściciela.'
      - '&cUsuwa miasto, claimy, COOP i dane miasta.'
      - '&cPublikuje reset statystyk dla członków.'
      - ''
      - '&eKliknij, aby rozpocząć potwierdzenie.'
    view_requirement:
      requirements:
        owner:
          type: string equals
          input: '%hextowns_is_owner%'
          output: 'true'
    left_click_commands:
      - '[player] town destroy'
      - '[openguimenu] town_destroy_confirm'

  leave:
    material: RED_BED
    slot: 24
    display_name: '&cOpuść COOP'
    lore:
      - '&7Dostępne tylko dla gracza COOP.'
      - '&cResetuje twoje statystyki SMP/EQ.'
      - ''
      - '&eKliknij, aby rozpocząć potwierdzenie.'
    view_requirement:
      requirements:
        coop:
          type: string equals
          input: '%hextowns_is_coop%'
          output: 'true'
    left_click_commands:
      - '[player] town endcoop'
      - '[openguimenu] town_leave_confirm'

  no_action:
    material: BARRIER
    slot: 22
    display_name: '&7Brak akcji dla tej roli'
    lore:
      - '&7Jeśli jesteś członkiem miasta, użyj panelu zarządzania.'
    view_requirement:
      requirements:
        no_town:
          type: string equals
          input: '%hextowns_has_town%'
          output: 'false'

  back:
    material: ARROW
    slot: 36
    display_name: '&ePowrót'
    left_click_commands:
      - '[openguimenu] town_manage'

  close:
    material: BARRIER
    slot: 40
    display_name: '&cZamknij'
    left_click_commands:
      - '[close]'

