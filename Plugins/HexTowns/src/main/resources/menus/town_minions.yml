# DeluxeMenus: menu minionów miasta
# Wymaga PlaceholderAPI expansion z HexMinions: %hexminions_*%
# Klikalność i informacje są przypięte do jednej główki reprezentującej miniona.

menu_title: '&8Miniony miasta'
open_command:
  - townminions
  - miniony
size: 54

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
