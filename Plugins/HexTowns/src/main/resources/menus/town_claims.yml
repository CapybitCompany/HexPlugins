# DeluxeMenus: claimy, mapa i lokalne informacje o chunkach

menu_title: '&8Miasto &7- teren'
open_command:
  - townclaims
  - claimy
size: 54

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '
    slots:
      - 0-53

  terrain_status:
    material: COMPASS
    slot: 4
    display_name: '&6Aktualny teren'
    lore:
      - '&7Chunk: &f%hextowns_current_chunk%'
      - '&7Teren: &f%hextowns_here_town_name%'
      - '&7To twoje miasto: &f%hextowns_here_is_own%'
      - '&7Możesz budować: &f%hextowns_can_build_here%'
      - ''
      - '&7Miasto: &e%hextowns_town_name%'
      - '&7Chunki: &f%hextowns_chunks%&7/&f%hextowns_max_chunks%'
      - '&7Growth points: &a%hextowns_growth%'

  claim:
    material: GRASS_BLOCK
    slot: 20
    display_name: '&aClaimuj aktualny chunk'
    lore:
      - '&7Wykonuje /town claim.'
      - '&7Wymaga przylegania bokiem do miasta.'
      - '&7Wymaga pustego bufora: &f%hextowns_buffer_chunks% chunk'
      - '&7Koszt: &f%hextowns_claim_cost_growth% GP'
      - ''
      - '&eKliknij, aby claimować.'
    left_click_commands:
      - '[player] town claim'
      - '[openguimenu] town_claims'

  here:
    material: OAK_SIGN
    slot: 22
    display_name: '&eCzyj to teren?'
    lore:
      - '&7Pokazuje informację o chunku w czacie.'
      - ''
      - '&eKliknij: /town here'
    left_click_commands:
      - '[player] town here'

  map:
    material: MAP
    slot: 24
    display_name: '&bMapa lokalna 9x9'
    lore:
      - '&7Pokazuje tekstową mapę chunków wokół ciebie.'
      - '&8X = ty, O = twoje miasto, T = inne, . = wolne'
      - ''
      - '&eKliknij: /town map'
    left_click_commands:
      - '[player] town map'

  visual_check:
    material: LIME_STAINED_GLASS
    slot: 30
    display_name: '&aWizualizacja granic'
    lore:
      - '&7Toggle podglądu miast fake-blockami.'
      - '&7Promień: &f%hextowns_visual_radius% chunków'
      - ''
      - '&eKliknij: /town check'
    left_click_commands:
      - '[player] town check'

  growth:
    material: EXPERIENCE_BOTTLE
    slot: 32
    display_name: '&aGrowth points'
    lore:
      - '&7Aktualnie: &a%hextowns_growth% GP'
      - '&7Rozwój miasta jest używany do claimów.'
      - ''
      - '&eKliknij: /town growth'
    left_click_commands:
      - '[player] town growth'

  info:
    material: PAPER
    slot: 34
    display_name: '&fInfo miasta'
    lore:
      - '&7Pełna linia informacji w czacie.'
      - ''
      - '&eKliknij: /town info'
    left_click_commands:
      - '[player] town info'

  back:
    material: ARROW
    slot: 45
    display_name: '&ePowrót'
    left_click_commands:
      - '[openguimenu] town_manage'

  close:
    material: BARRIER
    slot: 49
    display_name: '&cZamknij'
    left_click_commands:
      - '[close]'

