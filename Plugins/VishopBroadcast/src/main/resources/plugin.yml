name: VishopBroadcast
version: '1.0.0'
main: hex.vishopbroadcast.VishopBroadcastPlugin
api-version: '1.21.11'
description: Read-only vishop purchase broadcaster with shared DB queue
authors: [HexTeam]
depend:
  - HexCore
commands:
  vishopbroadcast:
    description: Reloads the read-only VishopBroadcast backend
    usage: /vishopbroadcast reload
    permission: vishopbroadcast.admin
permissions:
  vishopbroadcast.admin:
    description: Allows reloading VishopBroadcast config
    default: op

