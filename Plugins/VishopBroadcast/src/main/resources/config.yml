# VishopBroadcast
# Ten jar działa na podserwerze wyłącznie jako czytnik. Komendę zakupu
# /vishopbroadcast wykonuje VishopBroadcastProxy na Velocity.
#
# Format wiadomości obsługuje MiniMessage oraz placeholdery:
# {player}, {uuid}, {service}, {service_raw}, {amount}, {price}, {amount_part}, {price_part}, {info}, {date}, {server}

settings:
  poll-interval-seconds: 15
  fetch-limit: 100
  # true = po starcie serwera nie odtwarza starych logów, tylko czeka na nowe zakupy.
  skip-existing-logs-on-startup: true
  # Minimalna przerwa między kolejnymi wiadomościami, jeśli dana usługa pokazuje się wyłącznie na czacie.
  min-chat-only-interval-seconds: 1
tables:
  purchase-logs: "vishop_purchase_logs"

messages:
  no-permission: "<red>Nie masz uprawnień do tej komendy."
  reader-only: "<yellow>Ten podserwer tylko odczytuje zakupy. Komendę zakupu wykonaj na proxy Velocity."
  reloaded: "<green>Przeładowano konfigurację VishopBroadcast."
format:
  date-pattern: "yyyy-MM-dd HH:mm:ss"
  price-decimals: 2
  amount-part: " <dark_gray>x</dark_gray><white>{amount}</white>"
  price-part: " <gray>za</gray> <green>{price} zł</green>"

# Definicje wyglądu broadcastu. Klucz sekcji musi odpowiadać service_key zapisanemu przez proxy.
services:
  Vip:
    enabled: true
    display-name: "<yellow>VIP</yellow>"
    display:
      channels: ["CHAT"]
      duration-seconds: 4
      chat:
        lines:
          - ""
          - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "<gold><bold>SKLEP</bold></gold> <gray>Gracz <white>{player}</white> kupił rangę {service}{price_part}!"
          - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
      actionbar: "<gold>{player}</gold> <yellow>kupił {service}</yellow>{price_part}"
      title: "<gold><bold>NOWY ZAKUP</bold></gold>"
      subtitle: "<white>{player}</white> <gray>kupił</gray> {service}"
      title-times:
        fade-in-ticks: 10
        stay-ticks: 60
        fade-out-ticks: 20
  SVIP:
    enabled: true
    display-name: "<aqua>SVIP</aqua>"
    display:
      channels: ["CHAT"]
      duration-seconds: 5
      chat:
        lines:
          - ""
          - "<dark_aqua>✦ <aqua><bold>VI SHOP</bold></aqua> <dark_aqua>✦"
          - "<gray>Dziękujemy! <white>{player}</white> kupił rangę {service}{price_part}."
          - ""
      actionbar: "<aqua>✦</aqua> <white>{player}</white> <gray>kupił</gray> {service}<aqua> ✦</aqua>"
      title: "<aqua><bold>SVIP</bold></aqua>"
      subtitle: "<white>{player}</white> <gray>wspiera serwer</gray>"
      title-times:
        fade-in-ticks: 10
        stay-ticks: 70
        fade-out-ticks: 20
  Elita:
    enabled: true
    display-name: "<gradient:#ff55ff:#ffaa00><bold>ELITA</bold></gradient>"
    display:
      # Wszystkie domyślne komunikaty ViShop są wyświetlane wyłącznie na czacie.
      channels: ["CHAT"]
      duration-seconds: 6
      chat:
        lines:
          - "<light_purple>{player}</light_purple> <gray>kupił</gray> {service}{price_part}<gray>!"
      actionbar: "<gradient:#ff55ff:#ffaa00>★ {player} kupił ELITĘ ★</gradient>"
      title: "<gradient:#ff55ff:#ffaa00><bold>ELITA</bold></gradient>"
      subtitle: "<white>{player}</white> <gray>odblokował najwyższą rangę</gray>"
      title-times:
        fade-in-ticks: 10
        stay-ticks: 90
        fade-out-ticks: 20
  Coins:
    enabled: true
    display-name: "<gold>monety</gold>"
    amount-part: " <gray>w liczbie</gray> <yellow>{amount}</yellow>"
    display:
      channels: ["CHAT"]
      duration-seconds: 3
      chat:
        lines:
          - "<gold>⛃</gold> <white>{player}</white> <gray>kupił</gray>{amount_part} {service}{price_part}<gray>!</gray>"
      actionbar: "<gold>{player}</gold> <gray>kupił</gray>{amount_part} {service}"
      title: "<gold>MONETY</gold>"
      subtitle: "<white>{player}</white>{amount_part}"
      title-times:
        fade-in-ticks: 5
        stay-ticks: 50
        fade-out-ticks: 10
  Dar:
    enabled: true
    display-name: "<green>darowiznę</green>"
    amount-part: " <gray>w kwocie</gray> <green>{amount} zł</green>"
    price-part: ""
    display:
      channels: ["CHAT"]
      duration-seconds: 6
      chat:
        lines:
          - ""
          - "<green><bold>DAROWIZNA</bold></green> <dark_gray>»</dark_gray> <white>{player}</white>{amount_part} <gray>wsparł serwer. Dziękujemy!</gray>"
          - ""
      actionbar: "<green>Dziękujemy {player} za wsparcie!</green>"
      title: "<green><bold>DZIĘKUJEMY!</bold></green>"
      subtitle: "<white>{player}</white>{amount_part}"
      title-times:
        fade-in-ticks: 10
        stay-ticks: 80
        fade-out-ticks: 20


