chat:
  enabled: true
  format: "<gray>[<gold>Chat</gold>]</gray> <player><dark_gray>:</dark_gray> <message>"
  global-mute:
    enabled: true
    initially-muted: false
    bypass-permission: "hexchat.chatmute.bypass"
  # Ochrona przed konfliktami z innymi pluginami czatu (typowa przyczyna "Chat Verification Error").
  # HexChat nigdy nie zmienia podpisanej treści wiadomości — tylko anuluje lub podmienia render.
  conflict-guard:
    enabled: true
    warn-on-conflict: true      # loguj ostrzeżenie, gdy wykryto inny plugin czatu
    enforce-format: false       # true = HexChat zawsze narzuca swój format; false = ustępuje przy konflikcie
    known-chat-plugins:
      - "EssentialsXChat"
      - "VentureChat"
      - "ChatControl"
      - "ChatControlRed"
      - "DeluxeChat"
      - "TownyChat"
      - "Chatty"
      - "CMI"
      - "AdvancedChat"

# Filtr treści czatu: reklama, blacklista słów (hate speech) i anti-spam.
# action: BLOCK (anuluje wiadomość) lub CENSOR (maskuje dopasowania tylko w wyświetlaniu).
content-filter:
  enabled: true
  bypass-permission: "hexchat.filter.bypass"
  censor-mask: "***"
  anti-advertising:
    enabled: true
    action: "BLOCK"
    block-message: "<red>Reklamy i linki są zabronione.</red>"
    allowed-domains:
      - "twojserwer.pl"
    extra-patterns: []          # dodatkowe wzorce regex (opcjonalnie)
  blacklist:
    enabled: true
    action: "BLOCK"
    block-message: "<red>Twoja wiadomość zawiera niedozwolone słowa.</red>"
    # Podstawienia znaków: 4=a, 8=b, 3=e, 6/9=g, 1/!/|=i, 0=o, 5/$=s, 7/+=t, 2=z.
    # Symbole (@ $ ! | +) są wieloznaczne: mogą być literą ("te$t", "$hit", "t e $ t")
    # albo zwykłą interpunkcją ("test!"). Rozstrzyga to dopasowanie do konkretnego wpisu,
    # więc interpunkcja na brzegu słowa nie wchodzi do maskowanego fragmentu.
    match-leetspeak: true
    # Separatory między literami nie ratują słowa: "t e s t", "t.e.s.t", "t---e---s---t",
    # a także znaki formatujące i zero-width. Działa również razem z leetspeakiem.
    ignore-separators: true
    # Wpis blokuje również dłuższe słowo o tym samym początku, np. "brzydkie" -> "brzydkiego".
    # Dotyczy tylko wpisów o długości co najmniej 4 znaków; krótsze wymagają pełnego słowa.
    # Gdy trafienie jest rozstrzelone separatorami, do obejścia doliczane są też rozstrzelone
    # pojedyncze litery końcówki ("b r z y d k i e g o"). Zwarta grupa liter po spacji
    # to już nowe słowo i nie jest maskowana ("brzydkie go teraz").
    match-word-endings: true
    words: []                   # wpisz tutaj zabronione słowa (małymi literami)
  anti-spam:
    enabled: true
    block-message: "<red>Nie spamuj na czacie.</red>"
    max-repeated-messages: 3    # blokuj po N identycznych wiadomościach z rzędu
    max-caps-percentage: 70     # maks. % wielkich liter
    min-length-for-caps-check: 8

# Indywidualne (per gracz) wyciszenia, uzupełnienie globalnego wyciszenia.
# Zapisywane w mutes.yml w folderze pluginu. Obsługa: /hexchat mute <gracz> [czas] [powód]
player-mute:
  enabled: true
  bypass-permission: "hexchat.mute.bypass"
  default-reason: "Naruszenie regulaminu czatu."

cooldown:
  enabled: true
  bypass-permission: "hexchat.cooldown.bypass"
  use-luckperms-primary-group: true
  default-seconds: 10 # Ustaw 0, aby wyłączyć cooldown globalny.
  rank-cooldowns:
    - rank: "Gracz"
      seconds: 10 # Ustaw 0, aby wyłączyć cooldown dla rangi.
    - rank: "VIP"
      seconds: 2
    - rank: "SVIP"
      seconds: 2
    - rank: "Elita"
      seconds: 2
    - rank: "Media"
      seconds: 10
    - rank: "Admin"
      seconds: 2

  # Fallback po permissionach (używany, gdy brak dopasowania rangi LP).
  permission-overrides:
    - permission: "group.vip"
      seconds: 2

auto-messages:
  enabled: false
  interval-seconds: 180
  random-order: false
  messages:
    - "<gray>Odwiedź nasz Discord: <gold>discord.gg/twojserwer</gold></gray>"
    - "<gray>Użyj <gold>/help</gold>, aby sprawdzić najważniejsze komendy.</gray>"

command-filter:
  enabled: false
  bypass-permission: "hexchat.commandfilter.bypass"
  allowed-commands:
    - "helpop"
    - "punkty"
    - "tablica"
    - "lobby"
    - "spawn"
    - "help"
  hide-namespaced-suggestions: true
  allowed-namespaced-suggestions:
    - "essentials:spawn"
  block-message: "<red>Ta komenda jest zablokowana.</red>"

tab-complete-filter:
  enabled: false
  bypass-permission: "hexchat.tabcomplete.bypass"
  hidden-commands:
    - "pl"
    - "plugins"
    - "ver"
    - "version"
    - "about"
    - "bukkit:plugins"
    - "paper:plugins"

help:
  enabled: false
  mode: "CUSTOM" # CUSTOM | ESSENTIALS
  command-aliases:
    - "help"
  fallback-to-custom-when-essentials-missing: true
  unavailable-message: "<red>Tryb Essentials jest aktywny, ale plugin Essentials nie został znaleziony.</red>"
  custom-lines:
    - "<gold>Najważniejsze komendy:</gold>"
    - "<yellow>/spawn</yellow> <gray>- teleport do spawnu</gray>"
    - "<yellow>/msg (gracz) (wiadomość)</yellow> <gray>- prywatna wiadomość</gray>"

messages:
  prefix: "<dark_gray>[<dark_red>HEX</dark_red>]</dark_gray> "
  no-permission: "<red>Nie masz uprawnień do tej komendy.</red>"
  reloaded: "<green>Konfiguracja została przeładowana.</green>"
  usage: "<yellow>Użycie: /hexchat [reload|mute|unmute|togglemute|mutestatus]</yellow>"
  cooldown-wait: "<gold>Poczekaj jeszcze <white><seconds></white> <gold>sek.</gold>"
  chat-muted: "<red>Czat globalny jest aktualnie wyciszony.</red>"
  chat-mute-enabled: "<green>Wyciszyłeś globalny czat.</green>"
  chat-mute-disabled: "<green>Przywróciłeś globalny czat.</green>"
  chat-mute-already-enabled: "<yellow>Czat globalny jest już wyciszony.</yellow>"
  chat-mute-already-disabled: "<yellow>Czat globalny nie jest wyciszony.</yellow>"
  chat-mute-status-enabled: "<red>Status czatu: WYCISZONY.</red>"
  chat-mute-status-disabled: "<green>Status czatu: AKTYWNY.</green>"
  # Tekst, który wyciszony gracz dostaje przy próbie napisania na czacie.
  private-muted: "<red>Jesteś wyciszony (<time>). Powód: <reason></red>"
  # Natychmiastowe powiadomienie gracza online w chwili nałożenia wyciszenia.
  # Dostępne placeholdery: <player>, <time>, <reason>.
  # Gdy klucza brak (starszy config), używany jest tekst z 'private-muted'.
  player-mute-notification: "<red>Zostałeś wyciszony przez administrację na <white><time></white>. Powód: <reason></red>"
  # Tekst podstawiany pod <time> dla wyciszeń permanentnych.
  mute-time-permanent: "na zawsze"
  player-mute-set: "<green>Wyciszono gracza <white><player></white> na <white><time></white>. Powód: <reason></green>"
  player-mute-removed: "<green>Zdjęto wyciszenie z gracza <white><player></white>.</green>"
  player-mute-not-muted: "<yellow>Gracz <white><player></white> nie jest wyciszony.</yellow>"
  player-mute-target-not-found: "<red>Nie znaleziono gracza <white><player></white>.</red>"
  player-mute-info: "<gold>Gracz <white><player></white> jest wyciszony (<time>). Powód: <reason></gold>"
  player-mute-duration-invalid: "<red>Niepoprawny czas trwania: <white><input></white>. Przykłady: 30m, 2h, 7d, perm.</red>"
