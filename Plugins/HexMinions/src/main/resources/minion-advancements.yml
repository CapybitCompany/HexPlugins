      title: Czwarty stopień
      description: Posiadaj dowolnego miniona Tier IV lub wyżej.
      icon: GOLD_INGOT
      frame: task
      show-toast: true
      announce-to-chat: false
      hidden: false
      requirement:
        type: minion-tier
