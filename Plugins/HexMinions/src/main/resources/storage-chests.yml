settings:
  # true = obok miniona można postawić tylko skrzynkę stworzoną z receptury z tego pliku.
  # false = zwykły CHEST/TRAPPED_CHEST również będzie akceptowany.
  require-special-item: true
  # Czy stare, już postawione zwykłe skrzynki bez znacznika PDC dalej mają działać jako storage.
  allow-plain-chest-fallback: false

