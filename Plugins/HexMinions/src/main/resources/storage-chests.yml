settings:
  # true = obok miniona można postawić tylko skrzynkę stworzoną z receptury z tego pliku.
  # false = zwykły CHEST/TRAPPED_CHEST również będzie akceptowany.
  require-special-item: true
  # Czy stare, już postawione zwykłe skrzynki bez znacznika PDC dalej mają działać jako storage.
  allow-plain-chest-fallback: false

storage-chests:
  small:
    enabled: true
    slots: 3
    item:
      material: CHEST
      custom-model-data: 0
      display-name: "<gold>Mały Minion Storage</gold>"
      lore:
      - <gray>Mała skrzynka rozszerzeń dla miniona.</gray>
      - '<gray>Sloty storage: <white>3</white></gray>'
    recipe:
      # Receptura z ilościami jest obsługiwana przez special-items.yml → storage_expander.
      # Tutaj wyłączamy prostą vanilla recepturę Bukkit, żeby nie dało się ominąć wymogu 32 drewna na slot.
      enabled: false
      shape:
      - "WWW"
      - "WCW"
      - "WWW"
      ingredients:
        W: OAK_LOG
        C: CHEST

  medium:
    enabled: true
    slots: 5
    item:
      material: CHEST
      custom-model-data: 14101
      display-name: <yellow>Średni Minion Storage</yellow>
      lore:
      - <gray>Średnia skrzynka rozszerzeń dla miniona.</gray>
      - '<gray>Sloty storage: <white>5</white></gray>'
      - '<dark_gray>Odblokowanie: Minion złota Tier 7.</dark_gray>'
    recipe:
      enabled: false
      shape:
      - WWW
      - GSG
      - GCG
      ingredients: {}
  large:
    enabled: true
    slots: 7
    item:
      material: TRAPPED_CHEST
      custom-model-data: 14102
      display-name: <gold>Duży Minion Storage</gold>
      lore:
      - <gray>Duża skrzynka rozszerzeń dla miniona.</gray>
      - '<gray>Sloty storage: <white>7</white></gray>'
      - <dark_gray>Wymaga średniego storage i Compressor Update.</dark_gray>
    recipe:
      enabled: false
      shape:
      - WCW
      - NSN
      - NNN
      ingredients: {}
  iron_uranium:
    enabled: true
    slots: 5
    item:
      material: CHEST
      custom-model-data: 12103
      display-name: "<white>Żelazna skrzynka radioaktywna</white>"
      lore:
      - "<gray>Storage dla uranu i wzbogaconego uranu.</gray>"
      - "<gray>Sloty storage: <white>5</white></gray>"
