      lore:
      - <gray>Powiększa pojemność minionów i maszyn o <gold>3 sloty</gold>.</gray>
    recipe:
      # Receptura z ilościami jest obsługiwana przez special-items.yml → storage_expander.
      # Tutaj wyłączamy prostą vanilla recepturę Bukkit, żeby nie dało się ominąć wymogu 32 drewna na slot.
