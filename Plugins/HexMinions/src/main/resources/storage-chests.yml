settings:
  # true = obok miniona można postawić tylko skrzynkę stworzoną z receptury z tego pliku.
  # false = zwykły CHEST/TRAPPED_CHEST również będzie akceptowany.
  require-special-item: true
  # Czy stare, już postawione zwykłe skrzynki bez znacznika PDC dalej mają działać jako storage.
  allow-plain-chest-fallback: false

storage-chests:
  small:
    enabled: true
    slots: 3
    item:
      material: CHEST
      custom-model-data: 0
      display-name: "<gold>Rozszerzenie storage miniona</gold>"
      lore:
        - "<gray>Specjalna skrzynka dla miniona.</gray>"
        - "<gray>Po podłączeniu pojawia się fizycznie obok miniona.</gray>"
        - "<gray>Sloty storage: <white>3</white></gray>"
    recipe:
      # Receptura z ilościami jest obsługiwana przez special-items.yml → storage_expander.
      # Tutaj wyłączamy prostą vanilla recepturę Bukkit, żeby nie dało się ominąć wymogu 32 drewna na slot.
      enabled: false
      shape:
        - "WWW"
        - "WCW"
        - "WWW"
      ingredients:
        W: OAK_LOG
        C: CHEST

  medium:
    enabled: true
    slots: 9
    item:
      material: CHEST
      custom-model-data: 0
      display-name: "<yellow>Medium Minion Storage</yellow>"
      lore:
        - "<gray>Większa skrzynka dla miniona.</gray>"
        - "<gray>Sloty storage: <white>9</white></gray>"
    recipe:
      enabled: true
      shape:
        - "III"
        - "ICI"
        - "III"
      ingredients:
        I: IRON_INGOT
        C: CHEST

  large:
    enabled: true
    slots: 15
    item:
      material: TRAPPED_CHEST
      custom-model-data: 0
      display-name: "<gold>Large Minion Storage</gold>"
      lore:
        - "<gray>Duża skrzynka dla miniona.</gray>"
        - "<gray>Sloty storage: <white>15</white></gray>"
    recipe:
      enabled: true
      shape:
        - "DDD"
        - "DCD"
        - "DDD"
      ingredients:
        D: DIAMOND
        C: CHEST

  iron_uranium:
    enabled: true
    slots: 5
    item:
      material: CHEST
      custom-model-data: 12103
      display-name: "<white>Żelazna skrzynka radioaktywna</white>"
      lore:
        - "<gray>Storage dla uranu i wzbogaconego uranu.</gray>"
        - "<gray>Sloty storage: <white>5</white></gray>"
        - "<gray>Wzbogacony uran stackuje się docelowo do 16.</gray>"
    recipe:
      enabled: false
      shape: []
      ingredients: {}
