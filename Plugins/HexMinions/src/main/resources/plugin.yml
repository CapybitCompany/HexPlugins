name: HexMinions
version: 1.0.1
main: hex.minions.HexMinionsPlugin
api-version: "1.21"

depend:
  - HexCore
  - HexTowns
  - HexCollections

softdepend:
  - PlaceholderAPI

commands:
  minion:
    usage: "/minion <help|give|list|pickup|move|select|select-index|action|reload|admin addlimit>"
    description: Miniony miast Hex SMP
    permission: hexminions.use

permissions:
  hexminions.use:
    default: true
  hexminions.admin:
    default: op

