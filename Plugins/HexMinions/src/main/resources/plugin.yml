name: HexMinions
version: 1.0.11
main: hex.minions.HexMinionsPlugin
api-version: "1.21"

depend:
  - HexCore
  - HexTowns
  - HexCollections

softdepend:
  - PlaceholderAPI

commands:
  minion:
    usage: "/minion [help|list|wiki|dev]"
    description: Miniony miast Hex SMP
    permission: hexminions.use

permissions:
  hexminions.use:
    default: true
  hexminions.admin:
    default: op

