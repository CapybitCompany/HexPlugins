        amount: 1
        source: quest:daily_miner_01

  daily_ice_beast_01:
    enabled: true
    type: DAILY
    pool: combat_medium
    weight: 20
    scope: TOWN_PLAYER
    title: "Polowanie na Lodowe Bestie"
    objectives:
      - id: kill_ice_beasts
        trigger: custom.mob.kill
        filters:
          mob-id: hex:ice_beast
        amount: 10
    rewards:
      - type: town.growth.add
        amount: 2
        source: quest:daily_ice_beast_01

