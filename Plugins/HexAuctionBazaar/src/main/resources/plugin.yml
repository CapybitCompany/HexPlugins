name: HexAuctionBazaar
version: '1.0.0'
main: hex.auctionbazaar.HexAuctionBazaarPlugin
api-version: '1.21.11'
authors: [HexDevTeam]
description: Dom Aukcyjny oraz Rynek z natychmiastową sprzedażą, księgą zleceń i dynamicznymi cenami.

depend:
  - HexCore
  - HexEconomy

commands:
  hexauction:
    description: Otwiera Dom Aukcyjny lub zarządza aukcjami
    usage: /hexauction [sell <cena>|mylistings|cancel <id>|claims|admin cleanup|admin audit ...|admin dbstatus|reload]
    aliases: [auctionhouse, ah]
  hexbazaar:
    description: Otwiera Rynek lub zarządza zleceniami
    usage: /hexbazaar [buy <klucz> <ilość>|sell <klucz> <ilość>|orders|order cancel <id>|buyorder <klucz> <ilość> <cena>|selloffer <klucz> <ilość> <cena>|reload]
    aliases: [bazaar, bz]

permissions:
  hexauction.open:
    description: Otwiera Dom Aukcyjny
    default: true
  hexauction.sell:
    description: Wystawia przedmioty na aukcję
    default: true
  hexauction.cancel:
    description: Anuluje własne aukcje
    default: true
  hexauction.admin:
    description: Administracja Domu Aukcyjnego (reload, cleanup)
    default: op
  hexauction.admin.audit:
    description: Podgląd logu audytowego rynku
    default: op
  hexauction.admin.dbstatus:
    description: Podgląd stanu połączenia z bazą danych HexCore
    default: op
  hexbazaar.open:
    description: Otwiera Rynek
    default: true
  hexbazaar.buy:
    description: Natychmiastowe kupno na Rynku
    default: true
  hexbazaar.sell:
    description: Natychmiastowa sprzedaż na Rynku
    default: true
  hexbazaar.orders:
    description: Podgląd własnych zleceń
    default: true
  hexbazaar.order.create.buy:
    description: Wystawianie zleceń kupna
    default: true
  hexbazaar.order.create.sell:
    description: Wystawianie ofert sprzedaży
    default: true
  hexbazaar.order.cancel:
    description: Anulowanie własnych zleceń
    default: true
  hexbazaar.admin:
    description: Administracja Rynku (reload)
    default: op
