name: HexAuctionBazaar
version: '1.0.0'
main: hex.auctionbazaar.HexAuctionBazaarPlugin
api-version: '1.21.11'
authors: [HexDevTeam]
description: Dom Aukcyjny oraz Bazar z natychmiastowa sprzedaza, orderbookiem i dynamicznymi cenami.

depend:
  - HexCore
  - HexEconomy

commands:
  hexauction:
    description: Otwiera Dom Aukcyjny lub zarzadza aukcjami
    usage: /hexauction [sell <cena>|mylistings|cancel <id>|claims|admin cleanup|admin audit ...|reload]
    aliases: [auctionhouse, ah]
  hexbazaar:
    description: Otwiera Bazar lub zarzadza zleceniami
    usage: /hexbazaar [buy <klucz> <ilosc>|sell <klucz> <ilosc>|orders|order cancel <id>|buyorder <klucz> <ilosc> <cena>|selloffer <klucz> <ilosc> <cena>|reload]
    aliases: [bazaar, bz]

permissions:
  hexauction.open:
    description: Otwiera Dom Aukcyjny
    default: true
  hexauction.sell:
    description: Wystawia przedmioty na aukcje
    default: true
  hexauction.cancel:
    description: Anuluje wlasne aukcje
    default: true
  hexauction.admin:
    description: Administracja Domu Aukcyjnego (reload, cleanup)
    default: op
  hexauction.admin.audit:
    description: Podglad logu audytowego rynku
    default: op
  hexbazaar.open:
    description: Otwiera Bazar
    default: true
  hexbazaar.buy:
    description: Natychmiastowe kupno w Bazarze
    default: true
  hexbazaar.sell:
    description: Natychmiastowa sprzedaz w Bazarze
    default: true
  hexbazaar.orders:
    description: Podglad wlasnych zlecen
    default: true
  hexbazaar.order.create.buy:
    description: Wystawianie zlecen kupna
    default: true
  hexbazaar.order.create.sell:
    description: Wystawianie ofert sprzedazy
    default: true
  hexbazaar.order.cancel:
    description: Anulowanie wlasnych zlecen
    default: true
  hexbazaar.admin:
    description: Administracja Bazaru (reload)
    default: op
