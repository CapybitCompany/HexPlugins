plugins {
    id "java"
}

apply from: file('../gradle/ide-compat.gradle')

group = "hex"
version = "1.0.0"

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    implementation project(":plugins:HexCore") // dopasuj ścieżkę do Twojego multi-module
    compileOnly "io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

if (tasks.findByName('wrapper') == null) {
    tasks.register('wrapper') {
        group = 'build setup'
        description = 'Compatibility task for IDE/CI invocations of wrapper on plugin subprojects. Use the root wrapper task to generate Gradle wrapper files.'
        doLast {
            logger.lifecycle("Task ${path} is a compatibility task. Run ':wrapper' from the root project to generate Gradle wrapper files.")
        }
    }
}
