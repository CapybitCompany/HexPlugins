# ==========================================================
# HexPvpSmp - global config
# All player/admin UI text is Polish. This plugin owns spawn
# protection entirely (no WorldGuard). Towns are managed by a
# separate plugin and are NOT handled here.
# ==========================================================
enabled: true
# When true, protection decisions (pvp/build/mob denials) are logged.
debug: false

combat:
  duration-seconds: 15
  actionbar-enabled: true
  # Tick interval for the actionbar / combat-expiry sweep.
  actionbar-update-ticks: 10
  allowed-commands:
    - msg
    - r
    - tell
    - help
  # Punishment applied when a combat-tagged player quits.
  # Implemented manually — we do NOT trigger vanilla PlayerDeathEvent,
  # to avoid timing races and duplicate item drops.
  combat-log:
    # Master switch. false = only clear the combat tag, do not drop anything.
    enabled: true
    # When enabled, drop and clear the player's inventory + armor + offhand.
    drop-inventory: true
    # When enabled, drop the player's accumulated XP and reset level.
    drop-exp: true
    broadcast: "&c<player> wylogował się podczas walki i zginął."

# All user-facing messages. <command> and <seconds> are placeholders.
messages:
  no-permission: "&cNie masz uprawnień."
  pvp-denied: "&cPvP jest tutaj wyłączone."
  safezone-entry-denied: "&cNie możesz wejść na spawn podczas walki."
  command-blocked: "&cNie możesz użyć &f/<command> &cpodczas walki."
  combat-actionbar: "&cWalka: &f<seconds>s"
  leaving-spawn: "&eOpuszczasz ochronę spawnu."
  build-denied: "&cNie możesz tutaj budować."
  reload-success: "&aHexPvpSmp przeładowany."
  reload-failed: "&cPrzeładowanie nie powiodło się. Sprawdź konsolę."

safezones:
  block-entry-while-combat: true
  # Rate-limit per-player warning chat/actionbar messages.
  warning-cooldown-ticks: 20

# Regions are horizontal X/Z areas and protect EVERY height automatically
# (from world bottom to top). Only min-x/max-x/min-z/max-z are used; there is
# no min-y/max-y. This stops players bypassing spawn protection by building
# above or tunnelling below the box. (Legacy min-y/max-y are ignored + warned.)
worlds:
  world:
    enabled: true

    # SPAWN_SAFEZONE: no PvP, no build, blocks combat-tagged entry, blocks mobs.
    spawn:
      enabled: true
      block-mob-spawns: true
      region:
        type: CUBOID
        min-x: -100
        max-x: 100
        min-z: -100
        max-z: 100
      red-line:
        enabled: true
        # Blocks from spawn boundary that trigger the "leaving spawn" warning.
        warning-distance: 5

    # NO_BUILD: PvP allowed, combat allowed, but building/breaking is denied.
    # Keeps the area in front of spawn clean without being a PvP safe haven.
    no-build-zones:
      front_spawn:
        enabled: true
        region:
          type: CUBOID
          min-x: -150
          max-x: 150
          min-z: 101
          max-z: 180

    # Public chests: block coordinates players may open/use inside spawn.
    # They are protected from being broken/exploded. List each half of a
    # double chest separately.
    public-chests:
      spawn_public:
        world: world
        x: 0
        y: 65
        z: 0
