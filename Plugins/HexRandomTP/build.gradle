plugins {
    id 'java'
}

apply from: file('../gradle/plugin-generated-jars.gradle')

group = 'hex.randomtp'
version = '1.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.purpurmc.org/snapshots' }
}

dependencies {
    compileOnly 'org.purpurmc.purpur:purpur-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly files('../HexCore/build/libs/HexCore-plain.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.jar {
    archiveBaseName.set('HexRandomTP')
    archiveVersion.set('')
}
