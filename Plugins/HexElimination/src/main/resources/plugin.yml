name: HexElimination
version: '1.0.0'
main: hex.elimination.HexEliminationPlugin
api-version: '1.21'
description: Elimination system with spectator mode and admin resurrection
authors: [HexTeam]
depend:
  - HexCore
commands:
  resurect:
    description: Resurrect eliminated player
    usage: /resurect <nick_gracza>
    permission: hexelimination.admin
  resurectall:
    description: Resurrect ALL eliminated players and clear the elimination list
    usage: /resurectall [survival|creative|adventure|spectator]
    permission: hexelimination.admin
  elimination:
    description: Start or stop the elimination period
    usage: /elimination <start|stop>
    permission: hexelimination.admin
permissions:
  hexelimination.admin:
    description: Allows using elimination admin commands
    default: op

