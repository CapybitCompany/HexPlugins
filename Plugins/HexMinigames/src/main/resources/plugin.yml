name: HexMinigames
version: '1.0.0'
main: hex.minigames.HexMinigamesPlugin
api-version: '1.21.11'
description: HexEvents minigames series core module.
authors: [HexDevTeam]
depend:
  - HexEvents
softdepend:
  - HexCore
  - PlaceholderAPI
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.0

commands:
  hexminigames:
    description: Manage HexMinigames
    usage: /hexminigames <reload|status|stop|test|testareny|resetpunkty>
    permission: hexminigames.admin

permissions:
  hexminigames.admin:
    description: Allows managing HexMinigames
    default: op
