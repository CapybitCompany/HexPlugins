id: "mobs.silverfish"
aliases: ["mob_silverfish", "silverfish", "silverfish_kills", "rybik", "minecraft:silverfish"]
enabled: true

display:
  name: "&7Zabite silverfishe"
  category: "mobs"
  menu_slot: 43
  icon:
    material: INFESTED_STONE

valid_sources: [NATURAL_MOB_DROP, CUSTOM_PLUGIN_GRANTED]

sources:
  - trigger: minions.mob.killed
    amount-from: amount
    filters:
      mobType: silverfish

source_rules:
  NATURAL_MOB_DROP:
    allowed_worlds: [world, resource_world, mining_world]
    blocked_worlds: [spawn]
    allow_in_town_claims: true
  CUSTOM_PLUGIN_GRANTED:
    allow_in_town_claims: true

levels:
  1: {required: 5, display_name: "&7Silverfish I"}
  2: {required: 25, display_name: "&7Silverfish II"}
  3: {required: 100, display_name: "&7Silverfish III"}
  4: {required: 250, display_name: "&7Silverfish IV"}
  5: {required: 500, display_name: "&7Silverfish V"}

reward_claim_mode: AUTO
placeholder:
  progress_bar:
    length: 20
    filled_char: "■"
    empty_char: "□"
