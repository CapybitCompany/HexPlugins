id: "mobs.zombie"
aliases: ["mob_zombie", "zombie", "zombie_kills", "minecraft:zombie"]
enabled: true

display:
  name: "&2Zabite zombie"
  category: "mobs"
  menu_slot: 40
  icon:
    material: ZOMBIE_HEAD

valid_sources: [NATURAL_MOB_DROP, CUSTOM_PLUGIN_GRANTED]

sources:
  - trigger: minions.mob.killed
    amount-from: amount
    filters:
      mobType: zombie

source_rules:
  NATURAL_MOB_DROP:
    allowed_worlds: [world, resource_world, mining_world]
    blocked_worlds: [spawn]
    allow_in_town_claims: true
  CUSTOM_PLUGIN_GRANTED:
    allow_in_town_claims: true

levels:
  1: {required: 25, display_name: "&2Zombie I"}
  2: {required: 100, display_name: "&2Zombie II"}
  3: {required: 250, display_name: "&2Zombie III"}
  4: {required: 500, display_name: "&2Zombie IV"}
  5: {required: 1000, display_name: "&2Zombie V"}

reward_claim_mode: AUTO
placeholder:
  progress_bar:
    length: 20
    filled_char: "■"
    empty_char: "□"
